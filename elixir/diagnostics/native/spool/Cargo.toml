[package]
name = "overalls-trace-spool"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
opentelemetry-proto = { version = "0.31", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.38", features = ["bundled"] }

[dev-dependencies]
hegeltest = "=0.28.8"

# ADR-0265 canonical Rust lint policy. Copied verbatim into every Overalls crate;
# scripts/check_rust_lints.exs refuses drift. Gates run clippy with -D warnings.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
allow_attributes_without_reason = "warn"
mem_forget = "warn"
string_slice = "warn"
as_underscore = "warn"
lossy_float_literal = "warn"
# Internal unpublished crates: these pedantic lints add noise without catching defects.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
