[package]
name = "lyra"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "overalls"
path = "src/main.rs"

[[bin]]
name = "overalls-ssh-authorize"
path = "src/bin/overalls-ssh-authorize.rs"

[[bin]]
name = "overalls-workspaced"
path = "src/bin/overalls-workspaced.rs"

[[bin]]
name = "overalls-native-bootstrap"
path = "src/bin/overalls-native-bootstrap.rs"

[[bin]]
name = "overalls-native-grow-root"
path = "src/bin/overalls-native-grow-root.rs"

[[bin]]
name = "overalls-native-readinessd"
path = "src/bin/overalls-native-readinessd.rs"

[[bin]]
name = "overalls-native-trustd"
path = "src/bin/overalls-native-trustd.rs"

[[bin]]
name = "overalls-native-workspaced"
path = "src/bin/overalls-native-workspaced.rs"

[[bin]]
name = "overalls-native-kernel-probed"
path = "src/bin/overalls-native-kernel-probed.rs"

[[bin]]
name = "overalls-native-transport-probe"
path = "src/bin/overalls-native-transport-probe.rs"

[[bin]]
name = "overalls-native-agentd"
path = "src/bin/overalls-native-agentd.rs"

[[bin]]
name = "overalls-native-flushd"
path = "src/bin/overalls-native-flushd.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
libc = "0.2"
opentelemetry-proto = { version = "0.31", default-features = false, features = ["gen-tonic-messages", "metrics", "trace"] }
prost = "0.14"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-general-category = "1"
sha2 = "0.10"
ssh-key = { version = "0.6.7", features = ["ed25519"] }
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["native-tls-vendored"] }

[target.'cfg(windows)'.dependencies]
# Native TLS is schannel on Windows: the private client verifies the deployed
# private leaf the same way Linux guests do (see private_http).
reqwest = { version = "0.12.28", default-features = false, features = ["native-tls"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_NetManagement",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Security_Cryptography",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
hegeltest = "=0.28.8"

[patch.crates-io]
# fs2 0.4.3 omits illumos from its Solaris allocation fallback. The vendored
# patch adds that cfg only and preserves all upstream locking behavior.
fs2 = { path = "vendor/fs2" }

# ADR-0265 canonical Rust lint policy. Copied verbatim into every Overalls crate;
# scripts/check_rust_lints.exs refuses drift. Gates run clippy with -D warnings.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
allow_attributes_without_reason = "warn"
mem_forget = "warn"
string_slice = "warn"
as_underscore = "warn"
lossy_float_literal = "warn"
# Internal unpublished crates: these pedantic lints add noise without catching defects.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
