name: "mila release"

# Mila's release targets (ADR-0235). A pushed `mila-vX.Y.Z` tag is a signed
# run: every job runs inside the protected `mila-release` environment that
# alone holds the signing material, each signing input is required, and
# publish creates the GitHub release. Any other run (workflow_dispatch, on any
# ref, or a trunk push touching the mobile build) is an unsigned run: only the
# android and apple (macOS, iOS) jobs run, outside the environment, reading no
# signing secret. They build the unsigned APK and the ad-hoc
# `mila-build <platform> unsigned` DMG and IPA as MAJOR.MINOR.PATCH 0.0.<run
# number> and upload them as `unsigned-*` artifacts kept 7 days. source-bundle,
# linux, windows and publish are tag-only, so an unsigned run never publishes
# (contracts mila-release-publish-tag-only, mila-release-signing-leak).
# The Apple jobs hand mila-build its MILA_* inputs (mila/native/apple/build.sh);
# mila-build refuses a missing input and verifies each signature it makes.
# Signing material is written to job-temporary files and keychains that an
# always() step removes; nothing is echoed or committed.
#
# Secrets: APPLE_CERTIFICATE_P12_BASE64, APPLE_CERTIFICATE_PASSWORD,
# APPLE_MACOS_PROFILE_RUNNER_BASE64, APPLE_MACOS_PROFILE_NOTIFICATION_SERVICE_BASE64,
# APPLE_IOS_PROFILE_RUNNER_BASE64, APPLE_IOS_PROFILE_NOTIFICATION_SERVICE_BASE64,
# APPLE_IOS_EXPORT_OPTIONS_BASE64, APPLE_NOTARY_KEY_P8_BASE64, APPLE_NOTARY_KEY_ID,
# APPLE_NOTARY_ISSUER_ID, ANDROID_UPLOAD_KEYSTORE_BASE64,
# ANDROID_UPLOAD_STORE_PASSWORD, ANDROID_UPLOAD_KEY_PASSWORD,
# WINDOWS_CERTIFICATE_PFX_BASE64, WINDOWS_CERTIFICATE_PASSWORD.
# Variables: MILA_APPLE_TEAM, MILA_APPLE_IDENTITY (Developer ID for macOS),
# MILA_IOS_IDENTITY, MILA_MACOS_PROFILE_RUNNER,
# MILA_MACOS_PROFILE_NOTIFICATION_SERVICE, MILA_IOS_PROFILE_RUNNER,
# MILA_IOS_PROFILE_NOTIFICATION_SERVICE (profile names),
# MILA_ANDROID_UPLOAD_KEY_ALIAS, MILA_FCM_PROJECT_ID, MILA_FCM_APPLICATION_ID,
# MILA_FCM_API_KEY, MILA_FCM_SENDER_ID, MILA_WINDOWS_PUBLISHER,
# MILA_WINDOWS_TIMESTAMP_URL (optional).
on:
  push:
    tags: ["mila-v*"]
    branches: [trunk]
    # Trunk pushes only (tags ignore paths): the mobile build's own sources.
    # Kept narrow because the release-arm64 runners share the Namespace cap.
    paths:
      - ".github/workflows/mila-release.yml"
      - "mila/native/**"
      - "mila/BUCK"
  workflow_dispatch:

concurrency:
  group: mila-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source-bundle:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mila-v') }}
    runs-on: namespace-profile-cached-amd64-xl;container.privileged=true
    timeout-minutes: 60
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
      - uses: ./.github/actions/devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          install-devenv: "false"
      - name: Build the source bundle
        run: |
          tools/buck2 build //:package-tool-mila-source-bundle --show-full-output | tee bundle.txt
          bundle=$(cat "$(awk 'END { print $2 }' bundle.txt)")
          mkdir -p out
          cp -L "$bundle"/* out/
          (cd out && sha256sum -c SHA256SUMS)
      - name: Build the native Windows source bundle
        run: |
          tools/buck2 build //:package-tool-mila-windows-source-bundle --show-full-output | tee windows-bundle.txt
          bundle=$(cat "$(awk 'END { print $2 }' windows-bundle.txt)")
          mkdir -p out-windows
          cp -L "$bundle"/* out-windows/
          (cd out-windows && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: mila-source-bundle
          path: out/
          if-no-files-found: error
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: mila-windows-source-bundle
          path: out-windows/
          if-no-files-found: error

  linux:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mila-v') }}
    runs-on: namespace-profile-cached-amd64-xl;container.privileged=true
    timeout-minutes: 120
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
      - uses: ./.github/actions/devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          install-devenv: "false"
      - name: Linux release tarball
        run: |
          tools/buck2 build //:package-tool-mila-linux-release --show-full-output | tee release.txt
          release=$(cat "$(awk 'END { print $2 }' release.txt)")
          mkdir -p out
          cp -L "$release"/*.tar.gz "$release"/SHA256SUMS out/
          (cd out && sha256sum -c SHA256SUMS)
          archive=$(find out -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          tar -tzf "$archive" > release-files.txt
          if grep -Eiq '(^|/)(flutter|dart)(/|$)|flutter|\.dart$' release-files.txt; then
            echo 'native Linux release contains Flutter/Dart content' >&2
            cat release-files.txt >&2
            exit 1
          fi
          grep -Eq '(^|/)bin/mila$' release-files.txt
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-linux
          path: out/
          if-no-files-found: error

  android:
    # The release artifact is assembled by the native Jetpack Compose client.
    # Keep this job independent of Flutter so native release regressions cannot
    # be hidden by the legacy runner. Like apple, it runs on the profile with
    # no cache volume: pull-request jobs on cached-arm64 can write that
    # profile's tool and Actions caches, which a release job must never read.
    runs-on: namespace-profile-release-arm64
    # Signed runs only: an unsigned run needs no secret, and the environment's
    # protection rules must not gate trunk pushes.
    environment: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mila-v')) && 'mila-release' || '' }}
    timeout-minutes: 90
    # No Namespace remote cache: the release builds stay on this runner.
    env:
      OVERALLS_BUCK2_REMOTE: "off"
      MILA_SIGNED: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mila-v') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@138b5fb1cf087fdb4c5f3c621466fe304d0cf2e3 # v4.0.4
        with:
          packages: platform-tools
      - name: Install Android SDK and Rust targets
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2
      - uses: gradle/actions/setup-gradle@fbcece063590cf3e99cc8f93ed063231c98bf95 # v5.0.1
        with:
          gradle-version: '9.3.1'
      # tools/buck2 builds buckCells.aarch64-darwin, as in the apple job.
      - name: Setup Nix
        uses: cachix/install-nix-action@9aaadd8b85853f67fcdf488e6a4e9efa94ee96e2
      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: overalls
          extraPullNames: devenv
          useDaemon: false
      # A Buck2 target (ADR-0269 M9) over the SDKs above; the daemon starts
      # here with this environment. Gradle verifies every dependency against
      # gradle/verification-metadata.xml. The APK is unsigned, and no Buck2
      # log is uploaded.
      - name: Assemble native Android release APK
        run: |
          tools/buck2 build -c overalls.non_hermetic=true //mila:android-release
          out=mila/build/android-release
          mkdir -p "$out"
          if [ "$MILA_SIGNED" != true ]; then
            cp mila/native/android/app/build/outputs/apk/release/app-release-unsigned.apk \
              "$out/Mila-0.0.$GITHUB_RUN_NUMBER-unsigned.apk"
            (cd "$out" && shasum -a 256 -- *.apk > SHA256SUMS)
            echo "::notice title=Unsigned Android build::No mila-v* tag was pushed, so the APK is unsigned and is not published."
          fi
      # Signed runs: the upload key is decoded under umask 077 into
      # $RUNNER_TEMP and removed by an always() step; apksigner reads both
      # passwords from its environment (env:), never from argv. Nothing here
      # runs through Buck2. A missing input fails the run, so no unsigned APK
      # is published.
      - name: Sign the Android release APK
        if: env.MILA_SIGNED == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          MILA_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          MILA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          KEY_ALIAS: ${{ vars.MILA_ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in KEYSTORE MILA_ANDROID_STORE_PASSWORD MILA_ANDROID_KEY_PASSWORD KEY_ALIAS; do
            [ -n "${!name}" ] || { echo "a signed Android release requires $name" >&2; exit 1; }
          done
          version="${GITHUB_REF_NAME#mila-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $GITHUB_REF_NAME is not mila-vMAJOR.MINOR.PATCH" >&2; exit 1; }
          secrets="$RUNNER_TEMP/mila-android-signing"
          (umask 077 && mkdir -p "$secrets" && printf '%s' "$KEYSTORE" | base64 --decode > "$secrets/upload.jks")
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          out=mila/build/android-release
          "$apksigner" sign --ks "$secrets/upload.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:MILA_ANDROID_STORE_PASSWORD --key-pass env:MILA_ANDROID_KEY_PASSWORD \
            --out "$out/Mila-$version.apk" \
            mila/native/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$apksigner" verify --verbose "$out/Mila-$version.apk"
          rm -f "$out"/*.idsig
          (cd "$out" && shasum -a 256 -- "Mila-$version.apk" > SHA256SUMS)
      # Contract mila-release-signing-leak: the Android upload passwords, the
      # keystore's path and its bytes must not reach a Buck2 log, buck-out,
      # the daemon's files or a buck2 temporary directory.
      - name: Check Buck2 state holds no Android signing values
        if: always() && env.MILA_SIGNED == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/buck2-signing-check"
          keystore="$RUNNER_TEMP/mila-android-signing/upload.jks"
          mkdir -p "$logs"
          tools/buck2 log show > "$logs/show.txt" || true
          tools/buck2 log what-ran > "$logs/what-ran.txt" || true
          for f in buck-out/*/log/*.pb.zst; do
            [ -f "$f" ] && { tools/buck2 log show "$f" >> "$logs/events.txt" || true; }
          done
          places=("$logs" buck-out)
          [ -d "$HOME/.buck" ] && places+=("$HOME/.buck")
          for tmp in "${TMPDIR:-/tmp}"/buck2* /tmp/buck2*; do
            [ -e "$tmp" ] && places+=("$tmp")
          done
          leaked=0
          for value in "$STORE_PASSWORD" "$KEY_PASSWORD" "$keystore"; do
            [ -n "$value" ] || continue
            if grep -rqaF -e "$value" "${places[@]}" 2>/dev/null; then leaked=1; fi
          done
          if [ -s "$keystore" ]; then
            digest=$(shasum -a 256 < "$keystore" | cut -d' ' -f1)
            size=$(wc -c < "$keystore" | tr -d ' ')
            while IFS= read -r -d '' f; do
              [ "$(wc -c < "$f" | tr -d ' ')" = "$size" ] || continue
              [ "$(shasum -a 256 < "$f" | cut -d' ' -f1)" = "$digest" ] && leaked=1
            done < <(find "${places[@]}" -type f -print0 2>/dev/null)
          fi
          rm -rf "$logs"
          if [ "$leaked" = 1 ]; then
            echo 'an Android signing value reached Buck2 state or buck-out' >&2
            exit 1
          fi
      - name: Remove the Android signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/mila-android-signing"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          # Signed runs feed publish (release-*); unsigned runs never do.
          name: ${{ env.MILA_SIGNED == 'true' && 'release' || 'unsigned' }}-android
          path: |
            mila/build/android-release/*.apk
            mila/build/android-release/SHA256SUMS
          retention-days: ${{ env.MILA_SIGNED != 'true' && '7' || '' }}
          if-no-files-found: error

  apple:
    # Own profile with no cache volume: pull-request jobs on cached-arm64
    # share that profile's tool and Actions caches, which a signing job
    # must never read.
    runs-on: namespace-profile-release-arm64
    # Signed runs only, as in android.
    environment: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mila-v')) && 'mila-release' || '' }}
    timeout-minutes: 150
    # No Namespace remote cache: signed builds and their Buck2 state never
    # leave this runner (see the signing check below).
    env:
      OVERALLS_BUCK2_REMOTE: "off"
      MILA_SIGNED: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mila-v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            identity_var: MILA_APPLE_IDENTITY
            artifact: "*.dmg"
          - platform: ios
            identity_var: MILA_IOS_IDENTITY
            artifact: "*.ipa"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Nix
        uses: cachix/install-nix-action@9aaadd8b85853f67fcdf488e6a4e9efa94ee96e2
      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: overalls
          extraPullNames: devenv
          useDaemon: false
      - name: Install devenv
        run: |
          rev=$(jq -r '.nodes.devenv.locked.rev' devenv.lock)
          nix profile install "github:cachix/devenv/$rev"
      - name: Build Rust FFI for Apple native verification
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-ios
      - name: Compile typed Apple FFI seam
        run: tools/buck2 build -c overalls.non_hermetic=true //mila:apple-ffi
      - name: Verify Apple native package is Flutter-free
        working-directory: mila/native/apple
        env:
          MILA_FFI_LIB_DIR: ${{ github.workspace }}/mila/rust/target/release
        run: |
          set -euo pipefail
          if rg -n -i 'flutter' Package.swift Sources Tests; then
            echo 'Apple native package must remain independent of Flutter' >&2
            exit 1
          fi
          # The bundled locale catalogs are generated (as //mila:apple-swift-test
          # and build.sh do); the localization tests fail without them.
          python3 ../../localization/generate_catalogs.py \
            --source ../../localization/catalogs --output Sources/MilaNativeUI/Resources
          swift build -c release
          swift test -c release
      # Signing canaries for the Buck2 log check below: mask the values the
      # check looks for, so they never reach the job log either.
      - name: Mask the signing canaries
        if: env.MILA_SIGNED == 'true'
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          MILA_APPLE_IDENTITY: ${{ vars[matrix.identity_var] }}
        run: |
          set -euo pipefail
          for value in "$CERTIFICATE_PASSWORD" "$NOTARY_KEY_ID" "$NOTARY_ISSUER" "$MILA_APPLE_IDENTITY"; do
            [ -n "$value" ] && echo "::add-mask::$value"
          done
          true
      - name: Import signing identity, profiles and notary credentials
        if: env.MILA_SIGNED == 'true'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_RUNNER: ${{ matrix.platform == 'macos' && secrets.APPLE_MACOS_PROFILE_RUNNER_BASE64 || secrets.APPLE_IOS_PROFILE_RUNNER_BASE64 }}
          PROFILE_EXTENSION: ${{ matrix.platform == 'macos' && secrets.APPLE_MACOS_PROFILE_NOTIFICATION_SERVICE_BASE64 || secrets.APPLE_IOS_PROFILE_NOTIFICATION_SERVICE_BASE64 }}
          EXPORT_OPTIONS: ${{ secrets.APPLE_IOS_EXPORT_OPTIONS_BASE64 }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          for name in CERTIFICATE CERTIFICATE_PASSWORD PROFILE_RUNNER PROFILE_EXTENSION; do
            [ -n "${!name}" ] || { echo "a signed $PLATFORM release requires $name" >&2; exit 1; }
          done
          umask 077
          secrets="$RUNNER_TEMP/mila-signing"
          mkdir -p "$secrets"
          keychain="$secrets/mila.keychain-db"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          # The Buck2 log check reads it; removed with the signing material.
          printf '%s' "$password" > "$secrets/keychain-password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 -D > "$secrets/identity.p12"
          security import "$secrets/identity.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          rm -f "$secrets/identity.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          existing=()
          while IFS= read -r line; do existing+=("$(echo "$line" | tr -d '" ')"); done \
            < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          extension=$([ "$PLATFORM" = macos ] && echo provisionprofile || echo mobileprovision)
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            printf '%s' "$PROFILE_RUNNER" | base64 -D > "$dir/mila-runner.$extension"
            printf '%s' "$PROFILE_EXTENSION" | base64 -D > "$dir/mila-notification-service.$extension"
          done
          if [ "$PLATFORM" = macos ]; then
            printf '%s' "$NOTARY_KEY" | base64 -D > "$secrets/notary.p8"
            xcrun notarytool store-credentials mila-notary --key "$secrets/notary.p8" \
              --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --keychain "$keychain" > /dev/null
            rm -f "$secrets/notary.p8"
            echo "MILA_NOTARY_PROFILE=mila-notary" >> "$GITHUB_ENV"
          else
            printf '%s' "$EXPORT_OPTIONS" | base64 -D > "$secrets/ExportOptions.plist"
            echo "MILA_IOS_EXPORT_OPTIONS=$secrets/ExportOptions.plist" >> "$GITHUB_ENV"
          fi
          echo "MILA_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: ${{ matrix.platform }} release
        if: env.MILA_SIGNED == 'true'
        env:
          MILA_APPLE_TEAM: ${{ vars.MILA_APPLE_TEAM }}
          MILA_APPLE_IDENTITY: ${{ vars[matrix.identity_var] }}
          MILA_APPLE_PROFILE_RUNNER: ${{ matrix.platform == 'macos' && vars.MILA_MACOS_PROFILE_RUNNER || vars.MILA_IOS_PROFILE_RUNNER }}
          MILA_APPLE_PROFILE_NOTIFICATION_SERVICE: ${{ matrix.platform == 'macos' && vars.MILA_MACOS_PROFILE_NOTIFICATION_SERVICE || vars.MILA_IOS_PROFILE_NOTIFICATION_SERVICE }}
        run: |
          set -euo pipefail
          # mila-build refuses a missing input and verifies each signature it
          # makes; it writes the artifact and its SHA256SUMS.
          export MILA_VERSION="${GITHUB_REF_NAME#mila-v}"
          # The non_hermetic target reads MILA_VERSION, the MILA_APPLE_* names
          # and MILA_KEYCHAIN from the daemon's environment, so restart the
          # daemon here. No secret is in this environment: the import step
          # above holds those, and its only $GITHUB_ENV writes are the paths
          # and profile name MILA_KEYCHAIN, MILA_NOTARY_PROFILE and
          # MILA_IOS_EXPORT_OPTIONS. The check below verifies that against
          # this copy of the environment the daemon inherits. The target is
          # local_only and never uploaded to a cache, and no Buck2 log is
          # uploaded.
          (umask 077 && env > "$RUNNER_TEMP/mila-signing/release-env")
          tools/buck2 kill
          tools/buck2 build -c overalls.non_hermetic=true "//mila:${{ matrix.platform }}-release"
      # Unsigned runs: the same release configuration, ad-hoc signed, with no
      # signing input in the job at all. The daemon restarts to read
      # MILA_VERSION.
      - name: ${{ matrix.platform }} unsigned build
        if: env.MILA_SIGNED != 'true'
        run: |
          set -euo pipefail
          export MILA_VERSION="0.0.$GITHUB_RUN_NUMBER"
          mkdir -p "$RUNNER_TEMP/mila-signing"
          (umask 077 && env > "$RUNNER_TEMP/mila-signing/release-env")
          tools/buck2 kill
          tools/buck2 build -c overalls.non_hermetic=true "//mila:${{ matrix.platform }}-unsigned"
          echo "::notice title=Unsigned ${{ matrix.platform }} build::No mila-v* tag was pushed, so signing, notarization and publishing were skipped; Mila-$MILA_VERSION-unsigned is ad-hoc signed."
      # The Buck2 logs are collected without any secret in the environment,
      # then searched for the signing values; nothing here is uploaded. Both
      # steps run when the build fails, before the signing material goes.
      - name: Collect the Buck2 logs for the signing check
        if: always()
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/buck2-signing-check"
          mkdir -p "$logs"
          tools/buck2 log show > "$logs/show.txt" || true
          tools/buck2 log what-ran > "$logs/what-ran.txt" || true
          # Every invocation's event log, decoded by buck2 itself.
          for f in buck-out/*/log/*.pb.zst; do
            [ -f "$f" ] && { tools/buck2 log show "$f" >> "$logs/events.txt" || true; }
          done
          true
      # The job sets OVERALLS_BUCK2_REMOTE=off, so nothing reaches a remote
      # cache and the local places below are all Buck2 wrote.
      # Fails when a signing value reached the daemon's environment, a Buck2
      # event log, buck-out, the daemon's own files (~/.buck: buckd stderr
      # and state) or a buck2 temporary directory. The identity, a variable
      # rather than a secret, is searched in the action commands and
      # environments (what-ran) only: codesign's output in the event logs and
      # the signed artifacts in buck-out legitimately name it. build.sh never
      # reads MILA_IOS_EXPORT_OPTIONS and the target copies only
      # mila/build/<platform>-release, so no file anywhere searched may equal
      # the decoded ExportOptions.plist.
      # Contract mila-release-signing-leak: see .github/CONTRACTS. It also runs
      # on unsigned runs, which hold no secret: the daemon environment check
      # still applies.
      - name: Check Buck2 logs and buck-out hold no signing values
        if: always()
        env:
          CERTIFICATE_PASSWORD: ${{ env.MILA_SIGNED == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          NOTARY_KEY_ID: ${{ env.MILA_SIGNED == 'true' && secrets.APPLE_NOTARY_KEY_ID || '' }}
          NOTARY_ISSUER: ${{ env.MILA_SIGNED == 'true' && secrets.APPLE_NOTARY_ISSUER_ID || '' }}
          MILA_APPLE_IDENTITY: ${{ env.MILA_SIGNED == 'true' && vars[matrix.identity_var] || '' }}
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/buck2-signing-check"
          signing="$RUNNER_TEMP/mila-signing"
          mkdir -p "$logs"
          [ -f "$signing/release-env" ] && cp "$signing/release-env" "$logs/release-env"
          places=("$logs" buck-out)
          [ -d "$HOME/.buck" ] && places+=("$HOME/.buck")
          for tmp in "${TMPDIR:-/tmp}"/buck2* /tmp/buck2*; do
            [ -e "$tmp" ] && places+=("$tmp")
          done
          # An import that failed early leaves no keychain password: skip it.
          keychain_password=""
          [ -f "$signing/keychain-password" ] && keychain_password=$(cat "$signing/keychain-password")
          leaked=0
          for value in "$keychain_password" "$CERTIFICATE_PASSWORD" "$NOTARY_KEY_ID" "$NOTARY_ISSUER"; do
            [ -n "$value" ] || continue
            if grep -rqaF -e "$value" "${places[@]}" 2>/dev/null; then leaked=1; fi
          done
          if [ -n "$MILA_APPLE_IDENTITY" ] && [ -f "$logs/what-ran.txt" ] &&
             grep -qaF -e "$MILA_APPLE_IDENTITY" "$logs/what-ran.txt"; then leaked=1; fi
          if [ -s "$signing/ExportOptions.plist" ]; then
            digest=$(shasum -a 256 < "$signing/ExportOptions.plist" | cut -d' ' -f1)
            size=$(wc -c < "$signing/ExportOptions.plist" | tr -d ' ')
            while IFS= read -r -d '' f; do
              [ "$(wc -c < "$f" | tr -d ' ')" = "$size" ] || continue
              [ "$(shasum -a 256 < "$f" | cut -d' ' -f1)" = "$digest" ] && leaked=1
            done < <(find "${places[@]}" -type f -print0 2>/dev/null)
          fi
          # The daemon's environment holds only the expected paths and names.
          if [ -f "$logs/release-env" ]; then
            for name in MILA_KEYCHAIN MILA_IOS_EXPORT_OPTIONS; do
              value=$(sed -n "s/^$name=//p" "$logs/release-env")
              case "$value" in ""|"$RUNNER_TEMP"/mila-signing/*) ;; *) leaked=1 ;; esac
            done
            value=$(sed -n 's/^MILA_NOTARY_PROFILE=//p' "$logs/release-env")
            case "$value" in ""|mila-notary) ;; *) leaked=1 ;; esac
          fi
          rm -rf "$logs"
          if [ "$leaked" = 1 ]; then
            echo 'a signing value reached the Buck2 daemon environment, a Buck2 log or buck-out' >&2
            exit 1
          fi
      - name: Remove signing material
        if: always()
        run: |
          [ -n "${MILA_KEYCHAIN:-}" ] && security delete-keychain "$MILA_KEYCHAIN" || true
          rm -rf "$RUNNER_TEMP/mila-signing"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles"/mila-* \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"/mila-*
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          # Signed runs feed publish (release-*); unsigned runs never do.
          name: ${{ env.MILA_SIGNED == 'true' && 'release' || 'unsigned' }}-${{ matrix.platform }}
          path: |
            mila/build/${{ matrix.platform }}-${{ env.MILA_SIGNED == 'true' && 'release' || 'unsigned' }}/${{ matrix.artifact }}
            mila/build/${{ matrix.platform }}-${{ env.MILA_SIGNED == 'true' && 'release' || 'unsigned' }}/SHA256SUMS
          retention-days: ${{ env.MILA_SIGNED != 'true' && '7' || '' }}
          if-no-files-found: error

  windows:
    needs: source-bundle
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mila-v') }}
    runs-on: windows-2025
    environment: mila-release
    timeout-minutes: 120
    env:
      # Flutter remains a Windows-only compatibility build input while the
      # signed release jobs use native clients.
      FLUTTER_VERSION: 3.47.0
      FLUTTER_WINDOWS_SHA256: 9f96d393cdfad05bea0b4b42c603ffda027af11adadc8e4cf3ac87e49110c1ca
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mila-source-bundle
          path: ${{ runner.temp }}/bundle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mila-windows-source-bundle
          path: ${{ runner.temp }}/windows-bundle
      - name: Verify native Windows source bundle
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/windows-bundle"
          sha256sum -c SHA256SUMS
          tar -xzf mila-windows-source-bundle-*.tar.gz
          root=$(find . -maxdepth 1 -type d -name 'mila-windows-source-bundle-*' -print -quit)
          (cd "$root" && sha256sum --quiet -c SHA256SUMS)
          if find "$root" -type f \( -iname '*flutter*' -o -iname '*.dart' \) -print -quit | grep -q .; then
            echo 'native Windows source bundle contains Flutter/Dart input' >&2
            exit 1
          fi
      - name: Unpack and verify the source bundle
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bundle"
          sha256sum -c SHA256SUMS
          tar -xzf mila-source-bundle-*.tar.gz -C "$RUNNER_TEMP"
          root=$(cd "$RUNNER_TEMP" && cd mila-source-bundle-* && pwd -W)
          (cd "$root" && sha256sum --quiet -c SHA256SUMS)
          echo "MILA_ROOT=$root" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$root/pub-cache" >> "$GITHUB_ENV"
      - name: Install the pinned Flutter
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "flutter.zip"
          $url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_$($env:FLUTTER_VERSION)-stable.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:FLUTTER_WINDOWS_SHA256) { throw "Flutter archive digest $hash does not match the pin" }
          tar -xf $zip -C $env:RUNNER_TEMP
          Remove-Item $zip
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Resolve packages offline from the bundle
        run: |
          flutter config --no-analytics
          foreach ($d in "packages/mila_core", "packages/mila_transport", "tool", "app") {
            Push-Location (Join-Path $env:MILA_ROOT "mila/$d")
            flutter pub get --offline --enforce-lockfile
            if ($LASTEXITCODE -ne 0) { throw "pub get failed in $d" }
            Pop-Location
          }
      - name: Import the code-signing certificate
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "mila-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE))
          $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          "MILA_WINDOWS_CERT_SHA1=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Windows release (signed MSIX)
        working-directory: ${{ env.MILA_ROOT }}/mila/tool
        env:
          MILA_WINDOWS_PUBLISHER: ${{ vars.MILA_WINDOWS_PUBLISHER }}
          MILA_WINDOWS_TIMESTAMP_URL: ${{ vars.MILA_WINDOWS_TIMESTAMP_URL }}
        run: |
          dart run bin/mila_build.dart windows release
          if ($LASTEXITCODE -ne 0) { throw "mila-build windows release failed" }
      - name: Remove the code-signing certificate
        if: always()
        run: |
          Remove-Item (Join-Path $env:RUNNER_TEMP "mila-signing.pfx") -ErrorAction SilentlyContinue
          if ($env:MILA_WINDOWS_CERT_SHA1) {
            Remove-Item "Cert:\CurrentUser\My\$($env:MILA_WINDOWS_CERT_SHA1)" -DeleteKey -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-windows
          path: |
            ${{ env.MILA_ROOT }}/mila/build/windows-release/*.msix
            ${{ env.MILA_ROOT }}/mila/build/windows-release/SHA256SUMS
          if-no-files-found: error

  # Contract mila-release-publish-tag-only: see .github/CONTRACTS. Only a
  # pushed mila-v* tag publishes; every other run skips this job and its
  # tag-only needs.
  publish:
    needs: [source-bundle, linux, android, apple, windows]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mila-v') }}
    runs-on: ubuntu-24.04
    environment: mila-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Collect artifacts and checksums
        run: |
          set -euo pipefail
          mkdir -p release
          # Each job verified its own signatures; re-check its checksums here.
          for dir in artifacts/release-* artifacts/mila-source-bundle artifacts/mila-windows-source-bundle; do
            (cd "$dir" && sha256sum -c SHA256SUMS)
            find "$dir" -type f ! -name SHA256SUMS -exec cp {} release/ \;
          done
          (cd release && sha256sum -- * | LC_ALL=C sort -k2 > SHA256SUMS)
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Mila ${TAG#mila-v}" --notes "Signed Mila builds; verify with SHA256SUMS." \
            release/*
