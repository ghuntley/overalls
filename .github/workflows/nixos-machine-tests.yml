name: "nixos machine tests"

# The daily full run of every NixOS machine test, and the dispatch path for a
# chosen subset; ci.yml runs the affected ones on each trunk push (ADR-0270).
# The matrix lists every nixos_machine_test target from the Buck2 graph
# (tools/affected --all), which loads targets only; each job runs
# `tools/buck2 test` on one target, so a check that fails to evaluate fails
# its own job.
on:
  schedule:
    # Daily at 14:00 UTC
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      checks:
        description: Space-separated check names to run instead of every CI machine test.
        required: false
        default: ""

concurrency:
  group: nixos-machine-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    runs-on: namespace-profile-cached-amd64-xl;container.privileged=true
    timeout-minutes: 60
    outputs:
      tests: ${{ steps.select.outputs.tests }}
      errors: ${{ steps.select.outputs.errors }}
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
      - uses: ./.github/actions/devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          install-devenv: "false"
      - name: List machine tests
        run: tools/affected --all --output all.json
      - name: Apply requested subset
        id: select
        env:
          REQUESTED: ${{ inputs.checks }}
        run: |
          set -euo pipefail
          all=$(jq -c '[.machine_tests[] | {target, name: (.target | split(":") | last),
            nested_kvm: (.labels | index("nested_kvm") != null),
            known: (.labels | index("known_inception_failure") != null)}] | sort_by(.name)' all.json)
          tests=$(jq -cn --argjson all "$all" --arg req "${REQUESTED:-}" '
            ($req | split(" ") | map(select(. != ""))) as $r
            | if ($r | length) == 0 then $all
              else ($r - ($all | map(.name))) as $unknown
                | if ($unknown | length) > 0 then error("not CI machine tests: \($unknown | join(", "))")
                  else $all | map(select(.name as $n | $r | index($n))) end
              end')
          echo "Selected $(jq length <<<"$tests") machine tests"
          {
            echo "tests=$tests"
            echo "errors=$(jq '.errors | length' all.json)"
          } >> "$GITHUB_OUTPUT"
          jq -r '.errors[] | "::error title=selection error in \(.package)::\(.error | split("\n") | first)"' all.json

  machine:
    needs: discover
    if: needs.discover.outputs.tests != '[]'
    name: ${{ matrix.test.name }}
    runs-on: namespace-profile-cached-amd64-xl;container.privileged=true
    timeout-minutes: 240
    # Known Inception failures (AGENTS.md) are reported but do not fail the run.
    continue-on-error: ${{ matrix.test.known }}
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover.outputs.tests) }}
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
      - uses: ./.github/actions/devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          install-devenv: "false"
          system-features: nixos-test benchmark big-parallel kvm nested-kvm
      - name: Report virtualization
        run: |
          ls -l /dev/kvm
          grep -c -w -E 'vmx|svm' /proc/cpuinfo || echo "no vmx/svm CPU flag exposed"
      - name: Run ${{ matrix.test.name }}
        # Pushes the guest images, packages and test drivers built for this
        # scenario to the overalls cache as they are realised.
        env:
          TARGET: ${{ matrix.test.target }}
        run: cachix watch-exec overalls -- tools/buck2 test "$TARGET"

  # Fails the run when any package failed to load, after every machine test
  # that did load has run.
  evaluation:
    needs: [discover, machine]
    if: always() && needs.discover.result == 'success'
    runs-on: namespace-profile-cached-amd64
    steps:
      - name: Require every package to load
        env:
          ERRORS: ${{ needs.discover.outputs.errors }}
        run: |
          if [ "${ERRORS:-0}" -gt 0 ]; then
            echo "::error::$ERRORS packages failed to load; see the discover job"
            exit 1
          fi
