name: "build and publish: cache"

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

# A newer push supersedes any in-flight run on the same ref, trunk included,
# so CI always builds the latest commit instead of queueing a backlog.
concurrency:
  group: publish-cache-${{ github.ref }}
  # Let a started run finish so trunk records a result even under a steady
  # stream of pushes; GitHub keeps only the newest pending run per group.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Repository-wide gates: prek hooks (Python ruff/ty, conflict markers,
  # structured-event logging), the ADR checker and contract checks.
  gates:
    runs-on: namespace-profile-cached-amd64-xl;container.privileged=true
    timeout-minutes: 60
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
        with:
          fetch-depth: 0
      - uses: ./.github/actions/devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cache-paths: |
            ~/.cache/prek
      - name: Install contract tooling
        run: devenv shell -- npm ci --prefix tools/code-contracts --ignore-scripts
      - name: prek
        run: devenv shell -- prek run --all-files --show-diff-on-failure
      - name: ADRs
        run: devenv shell -- elixir scripts/check_adrs.exs
      - name: Contracts
        run: |
          devenv shell -- node scripts/check_contracts.mjs coverage
          devenv shell -- node --test scripts/test/check_contracts_test.mjs

  # Each Elixir project's `mix precommit` gate against the devenv PostgreSQL.
  #
  # Marshall's suite is mostly synchronous modules, which ExUnit runs one at a
  # time, so a single runner needs well over the 240-minute limit (run
  # 41008589168 was cancelled at 240 minutes with the real-deadline terminal
  # properties still running). It runs as four `mix test --partitions` slices;
  # each slice job still runs every other precommit gate and the complete
  # Covenant contract suite.
  precommit:
    name: precommit (${{ matrix.project }}${{ matrix.partition && format(' {0}/4', matrix.partition) || '' }})
    runs-on: namespace-profile-cached-amd64-xl;container.privileged=true
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        project: [protocol, lilly, audi, brady, ziggy, porsche, galileo, enrico, peach, susan]
        include:
          - {project: marshall, partition: 1}
          - {project: marshall, partition: 2}
          - {project: marshall, partition: 3}
          - {project: marshall, partition: 4}
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
        with:
          fetch-depth: 0
      # Each service keeps its fetched deps and compiled _build (including the
      # Dialyzer project PLT); Hex, Mix (core PLTs) and rebar3 caches are shared.
      # _build/<env>/lib/<app>/priv is a symlink to the source priv/, so a
      # Rustler NIF (Marshall's priv/native/marshall_cedar.so, gitignored)
      # lives outside _build. Without caching it, a restored _build holds the
      # compiled NIF module but a fresh checkout lacks the library, nothing
      # recompiles, and the application cannot start (run 41176375306).
      # Only Marshall's priv/native is cached: Protocol tracks files under its
      # priv/native, which a cache-volume mount would hide (run 41180754386).
      - uses: ./.github/actions/devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cache-paths: |
            ${{ matrix.project }}/deps
            ${{ matrix.project }}/_build
            ${{ matrix.project == 'marshall' && 'marshall/priv/native' || '' }}
            ~/.mix
            ~/.hex
            ~/.cache/rebar3
      - name: Install contract tooling
        run: devenv shell -- npm ci --prefix tools/code-contracts --ignore-scripts
      - name: Start PostgreSQL
        run: |
          devenv up --detach postgres
          for _ in $(seq 1 60); do
            if devenv shell -- pg_isready -q; then exit 0; fi
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1
      # Namespace sets TMPDIR under the long workspace path; Lilly's jail
      # socket paths built under tmp_dir must stay within the 108-byte UNIX
      # socket limit, as they do on hosts.
      # Dialyxir names PLTs by OTP version only, so a rebuilt Erlang with the
      # same version (for example after a flake.lock change) reuses PLTs on
      # the cache volume that list beams from a store path the runner no
      # longer has, and `dialyzer --force-check` fails with "File not found"
      # (run 41084465906). Drop the PLTs whenever the Erlang root differs
      # from the one they were built against.
      - name: Drop Dialyzer PLTs built against another Erlang
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          devenv shell -- bash -euo pipefail -c '
            cd "$PROJECT"
            root=$(erl -noshell -eval "io:put_chars(code:root_dir()), halt().")
            marker=_build/.dialyzer-erlang-root
            if [ "$(cat "$marker" 2>/dev/null || true)" != "$root" ]; then
              echo "Erlang root is now $root; dropping cached PLTs"
              rm -f _build/*/dialyxir_*.plt _build/*/dialyxir_*.plt.hash \
                "$HOME"/.mix/dialyxir_*.plt "$HOME"/.mix/dialyxir_*.plt.hash
              mkdir -p _build
              printf "%s" "$root" > "$marker"
            fi'
      - name: mix precommit
        working-directory: ${{ matrix.project }}
        env:
          TMPDIR: /tmp
          # Only Marshall reads these; other projects see them empty.
          MARSHALL_TEST_PARTITIONS: ${{ matrix.partition && '4' || '' }}
          MIX_TEST_PARTITION: ${{ matrix.partition }}
          NIF_LIBRARY: ${{ matrix.project == 'marshall' && 'priv/native/marshall_cedar.so' || '' }}
        # The cache volume keeps _build across runs, including compile
        # manifests that recorded warnings (such as "already consolidated"
        # from an older in-VM `gettext.extract`), and every later
        # `compile --warnings-as-errors` replays them. A strict compile that
        # fails is retried once with --force, which drops stale replays but
        # still fails on any warning the current source produces.
        # When Marshall's Cedar NIF library (NIF_LIBRARY) is missing, as after a
        # cache restored before priv/native was cached, its compiled app is
        # dropped so the NIF module rebuilds it. Lilly and Enrico native/ crates
        # are not Rustler NIFs, so only Marshall sets NIF_LIBRARY.
        run: >-
          devenv shell -- bash -euo pipefail -c 'mix deps.get
          && { [ -z "$NIF_LIBRARY" ] || [ -f "$NIF_LIBRARY" ]
          || rm -rf _build/test/lib/marshall; }
          && { MIX_ENV=test mix compile --warnings-as-errors
          || MIX_ENV=test mix compile --force --warnings-as-errors; }
          && mix precommit'
      - name: Verify precommit left no changes
        run: git diff --exit-code

  # Builds every CI-enabled flake check that is not a NixOS machine test
  # (meta.ci, nix/verification/tests/ci.nix) and publishes it to Cachix.
  # Machine tests run in nixos-machine-tests.yml.
  #
  # The selected checks are built in shards on separate runners: built on one
  # runner, their evaluation-time images, build directories and outputs
  # outgrew its 116 GB store volume (ENOSPC in run 40999640832) even after
  # selection collected its garbage, and a round-robin shard holding several
  # 60-80 GB checks did too (run 41034532972), so those checks build alone.
  # `nix` is the aggregate gate.
  nix-select:
    runs-on: namespace-profile-cached-amd64-xl;container.privileged=true
    timeout-minutes: 120
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      errors: ${{ steps.select.outputs.errors }}
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
        with:
          fetch-depth: 0
      - uses: ./.github/actions/devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          install-devenv: "false"
      - name: Select checks
        id: select
        run: .github/scripts/select-checks.sh build
      # Every isolated check (meta.ci.isolated) gets a shard of its own; the
      # rest are dealt round-robin over SHARDS shards. Each selected check is
      # in exactly one shard.
      - name: Plan shards
        id: shards
        env:
          CHECKS: ${{ steps.select.outputs.checks }}
          ISOLATED: ${{ steps.select.outputs.isolated }}
          SHARDS: 7
        run: |
          set -euo pipefail
          shards=$(jq -cn --argjson checks "$CHECKS" --argjson isolated "$ISOLATED" --argjson n "$SHARDS" '
            ($isolated | map({name: ., checks: [.]}))
            + ([($checks - $isolated) | to_entries[] | {shard: (.key % $n), attr: .value}]
               | group_by(.shard) | map({name: "shard \(.[0].shard + 1)/\($n)", checks: map(.attr)}))')
          jq -e --argjson checks "$CHECKS" '[.[].checks[]] | sort == ($checks | sort)' <<<"$shards" > /dev/null
          echo "Build shards: $shards"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  nix-build:
    needs: nix-select
    if: needs.nix-select.outputs.shards != '[]'
    name: nix-build (${{ matrix.shard.name }})
    runs-on: namespace-profile-cached-amd64-xl;container.privileged=true
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.nix-select.outputs.shards) }}
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
        with:
          fetch-depth: 0
      - uses: ./.github/actions/devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          install-devenv: "false"
      - name: Build checks
        env:
          CHECKS: ${{ toJSON(matrix.shard.checks) }}
        run: |
          set -euo pipefail
          mapfile -t names < <(jq -r '.[]' <<<"$CHECKS")
          echo "Building ${#names[@]} checks: ${names[*]}"
          # watch-exec uploads everything realised during the build to the
          # overalls cache, including paths a previous job on this cache
          # volume built but could not push.
          cachix watch-exec overalls -- \
            nix build -L --no-link --keep-going "${names[@]/#/.#checks.x86_64-linux.}"
          df -h /nix/store || true

  nix:
    needs: [nix-select, nix-build]
    if: always()
    runs-on: namespace-profile-cached-amd64
    steps:
      - name: Require selection and every build shard to succeed
        env:
          SELECT: ${{ needs.nix-select.result }}
          BUILD: ${{ needs.nix-build.result }}
        run: |
          if [ "$SELECT" != success ]; then
            echo "::error::check selection did not succeed ($SELECT)"
            exit 1
          fi
          if [ "$BUILD" != success ] && [ "$BUILD" != skipped ]; then
            echo "::error::a build shard did not succeed ($BUILD)"
            exit 1
          fi
      - name: Require every check to evaluate
        env:
          ERRORS: ${{ needs.nix-select.outputs.errors }}
        run: |
          if [ "${ERRORS:-0}" -gt 0 ]; then
            echo "::error::$ERRORS checks failed to evaluate; see the nix-select job summary"
            exit 1
          fi
