name: "mila builds"

# Mila's dev targets on every platform (ADR-0235). The platform builds are
# Buck2 targets (ADR-0269 M9, see the buck2 skill): Android, Apple and Windows
# build the non_hermetic //mila: targets with the runner's SDKs; Apple and
# Android build on macOS with tools/buck2 over buckCells.aarch64-darwin, and
# Windows, which has no Nix, runs `tools/buck2 --no-nix` with the pinned buck2
# and prelude. The Android emulator and journey fixture need KVM, so they run
# the macOS-built APKs on Linux; the journey-fixture job builds the fixture
# once on Namespace and they substitute it from Cachix. Windows builds no DLL:
# it imports the reproducible gnu FFI DLL that the Linux windows-ffi job
# publishes.
# Linux also runs the Windows managed adapter and ABI smoke target with the
# Windows project's .NET SDK, independently of the native platform journeys.
on:
  pull_request:
    paths:
      # Root Cargo workspace manifest and its single lock (ADR-0273).
      - "Cargo.toml"
      - "Cargo.lock"
      - "mila/**"
      - "mila/rust/**"
      - "protocol/test/fixtures/**"
      - "nix/domains/artifacts/mila/**"
      - "nix/platform/dartssh2.nix"
      - "nix/platform/patches/dartssh2-*"
      - ".github/workflows/mila-builds.yml"
      # The tailnet join, forward and peer scripts the journey jobs run.
      - ".github/scripts/mila-tailnet-*"
      # The Buck2 build of the //mila: targets (ADR-0269 M9): the wrapper and
      # its no-Nix mode, the cells and toolchains, and only the rule files
      # mila/BUCK loads (`buck2 audit includes mila/BUCK`) plus the driver.
      - "tools/buck2"
      - "tools/buck2_no_nix.py"
      - "tools/buck2-no-nix.json"
      - "toolchains/**"
      - "nix/buck/**"
      - ".buckconfig"
      - "buck/mila.bzl"
      - "buck/nix.bzl"
      - "buck/checks.bzl"
      - "buck/mila_platform.py"
      - "buck/mila_windows_dll.py"
      - "buck/BUCK"
  push:
    branches: [trunk]
    paths:
      # Root Cargo workspace manifest and its single lock (ADR-0273).
      - "Cargo.toml"
      - "Cargo.lock"
      - "mila/**"
      - "mila/rust/**"
      - "protocol/test/fixtures/**"
      - "nix/domains/artifacts/mila/**"
      - "nix/platform/dartssh2.nix"
      - "nix/platform/patches/dartssh2-*"
      - ".github/workflows/mila-builds.yml"
      # The tailnet join, forward and peer scripts the journey jobs run.
      - ".github/scripts/mila-tailnet-*"
      # The Buck2 build of the //mila: targets (ADR-0269 M9): the wrapper and
      # its no-Nix mode, the cells and toolchains, and only the rule files
      # mila/BUCK loads (`buck2 audit includes mila/BUCK`) plus the driver.
      - "tools/buck2"
      - "tools/buck2_no_nix.py"
      - "tools/buck2-no-nix.json"
      - "toolchains/**"
      - "nix/buck/**"
      - ".buckconfig"
      - "buck/mila.bzl"
      - "buck/nix.bzl"
      - "buck/checks.bzl"
      - "buck/mila_platform.py"
      - "buck/mila_windows_dll.py"
      - "buck/BUCK"
  workflow_dispatch:

concurrency:
  group: mila-builds-${{ github.ref }}
  # Let a started run finish so trunk records a result even under a steady
  # stream of pushes; GitHub keeps only the newest pending run per group.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source-bundle:
    runs-on: namespace-profile-cached-amd64-xl;container.privileged=true
    timeout-minutes: 60
    # Namespace remote cache (ADR-0276) for this hermetic job only: the
    # non_hermetic platform jobs stay local and receive no token. Pull
    # requests from forks get no secret and build locally.
    env:
      NAMESPACE_RBE_TOKEN: ${{ secrets.NAMESPACE_RBE_TOKEN }}
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
      - uses: ./.github/actions/devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          install-devenv: "false"
      - name: Validate shared localization catalogs
        run: |
          python3 -m unittest mila/localization/test_generate_catalogs.py
          python3 mila/localization/generate_catalogs.py \
            --source marshall/priv/gettext \
            --output "$RUNNER_TEMP/mila-localization"
          python3 mila/localization/generate_catalogs.py \
            --source mila/localization/catalogs \
            --output "$RUNNER_TEMP/mila-localization-app"
      - name: Build the source bundle
        run: |
          tools/buck2 build //:package-tool-mila-source-bundle --show-full-output | tee bundle.txt
          bundle=$(cat "$(awk 'END { print $2 }' bundle.txt)")
          mkdir -p out
          cp -L "$bundle"/* out/
          (cd out && sha256sum -c SHA256SUMS)
      - name: Build the native Windows source bundle
        run: |
          tools/buck2 build //:package-tool-mila-windows-source-bundle --show-full-output | tee windows-bundle.txt
          bundle=$(cat "$(awk 'END { print $2 }' windows-bundle.txt)")
          mkdir -p out-windows
          cp -L "$bundle"/* out-windows/
          (cd out-windows && sha256sum -c SHA256SUMS)
      - name: Check Buck2 state for the Namespace token
        if: always()
        run: tools/namespace-token-scan
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: mila-source-bundle
          path: out/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: mila-windows-source-bundle
          path: out-windows/
          if-no-files-found: error
          retention-days: 7

  apple-native:
    runs-on: namespace-profile-cached-arm64
    timeout-minutes: 120
    env:
      MILA_TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.MILA_TAILSCALE_OAUTH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # tools/buck2 builds buckCells.aarch64-darwin: buck2, the prelude and a
      # few host tools, substituted from Cachix (the patched nixpkgs source
      # from devenv's cache); a miss builds three small derivations.
      - name: Setup Nix
        uses: cachix/install-nix-action@9aaadd8b85853f67fcdf488e6a4e9efa94ee96e2
      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: overalls
          extraPullNames: devenv
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false
      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-ios-sim
          components: clippy
      # Bounded so a cold cells build fails well inside the job timeout. The
      # daemon starts here and keeps this step's PATH (cargo, Xcode).
      - name: Materialise the Buck2 cells
        timeout-minutes: 20
        run: tools/buck2 --version
      - name: Build Rust FFI for Apple native tests
        run: tools/buck2 build -c overalls.non_hermetic=true //mila:apple-ffi
      - name: Clippy the Rust FFI
        run: tools/buck2 build -c overalls.non_hermetic=true //mila:apple-ffi-clippy
      # Generates the bundled locale catalogs, then runs swift test against
      # the FFI above.
      - name: Swift native package tests
        run: tools/buck2 build -c overalls.non_hermetic=true //mila:apple-swift-test
      - name: macOS software-key custody and release-refusal tests
        run: tools/buck2 build -c overalls.non_hermetic=true //mila:apple-software-keys-test
      - name: Apple app InfoPlist localization tests
        run: python3 -m unittest mila/localization/test_apple_infoplist_strings.py
      # The package declares iOS support, so build the app for both platforms;
      # swift test alone compiles only the macOS slice.
      - name: Build the macOS dev app
        run: tools/buck2 build -c overalls.non_hermetic=true //mila:macos-dev
      - name: Build the iOS-simulator dev app
        run: tools/buck2 build -c overalls.non_hermetic=true //mila:ios-dev
      # Tunnelled fixture (ADR-0264): the Linux `journey-fixture-tailnet` job
      # serves the hermetic backend on the tailnet. Skipped without the secret.
      # The Namespace macOS image has no /usr/local/bin, where the Tailscale
      # action copies its binaries.
      - name: Create the Tailscale install directory
        if: env.MILA_TAILSCALE_OAUTH_CLIENT_ID != ''
        run: sudo mkdir -p /usr/local/bin
      - name: Join the Mila CI tailnet
        if: env.MILA_TAILSCALE_OAUTH_CLIENT_ID != ''
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ env.MILA_TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.MILA_TAILSCALE_OAUTH_SECRET }}
          tags: tag:mila-ci
          hostname: mila-apple-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Forward the tailnet fixture to localhost
        if: env.MILA_TAILSCALE_OAUTH_CLIENT_ID != ''
        timeout-minutes: 65
        run: .github/scripts/mila-tailnet-fixture.sh "$RUNNER_TEMP/mila-journey-descriptor.json"
      - name: Apple journey against the tunnelled fixture
        id: apple-journey
        if: env.MILA_TAILSCALE_OAUTH_CLIENT_ID != ''
        working-directory: mila/native/apple
        timeout-minutes: 20
        env:
          MILA_FFI_LIB_DIR: ${{ github.workspace }}/mila/rust/target/release
          MILA_JOURNEY_DESCRIPTOR: ${{ runner.temp }}/mila-journey-descriptor.json
        # The filter matches test case names (`<target>.<class>/<test>`), not
        # file names: name the journey classes of MilaJourneyTests.swift.
        run: swift test --filter 'MilaNativeUITests\.(MilaFixtureJourneyTests|MilaJourneyDescriptorTests)/'
      # An explicit result lets the fixture job stop once every journey ended.
      - name: Report the journey result to the tailnet fixture
        if: always() && env.MILA_TAILSCALE_OAUTH_CLIENT_ID != ''
        shell: bash
        env:
          OUTCOME: ${{ steps.apple-journey.outcome }}
          NODE: mila-apple-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if ! address=$(cat "$RUNNER_TEMP/mila-tailnet-fixture-address" 2>/dev/null); then
            echo "no tunnelled fixture was reached; nothing to report"
            exit 0
          fi
          curl -sS --max-time 10 -X POST "http://$address:8445/finished/$NODE/${OUTCOME:-skipped}" || true

  # The published Windows FFI DLL (ADR-0269 M9): cross-built for
  # x86_64-pc-windows-gnu on Linux by the hermetic //mila:windows-ffi-gnu,
  # rebuilt independently and compared byte for byte, and checked against the
  # C header and the .NET imports. windows-native imports this artifact and
  # verifies it against the `sha256` output instead of building a DLL.
  windows-ffi:
    runs-on: namespace-profile-cached-amd64-xl;container.privileged=true
    timeout-minutes: 60
    outputs:
      sha256: ${{ steps.publish.outputs.sha256 }}
    # Namespace remote cache (ADR-0276) for this hermetic job; the
    # independent rebuild never reads or writes a cache.
    env:
      NAMESPACE_RBE_TOKEN: ${{ secrets.NAMESPACE_RBE_TOKEN }}
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
      - uses: ./.github/actions/devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          install-devenv: "false"
      - name: Build, rebuild and check the Windows FFI DLL
        run: |
          tools/buck2 test //mila:windows-ffi-gnu-reproducible //mila:windows-ffi-gnu-abi //mila:windows-ffi-gnu-clippy
          for target in windows-ffi-gnu-reproducible windows-ffi-gnu-abi; do
            cat "$(tools/buck2 build "//mila:$target" --show-full-simple-output)"
          done
      - name: Stage the DLL
        id: publish
        run: |
          dir=$(tools/buck2 build //mila:windows-ffi-gnu --show-full-simple-output)
          mkdir -p out
          cp -L "$dir/mila_ffi.dll" "$dir/SHA256SUMS" out/
          (cd out && sha256sum -c SHA256SUMS)
          sha256=$(sha256sum out/mila_ffi.dll | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "mila_ffi.dll sha256 $sha256" >> "$GITHUB_STEP_SUMMARY"
      - name: Check Buck2 state for the Namespace token
        if: always()
        run: tools/namespace-token-scan
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: mila-windows-ffi
          path: out/
          if-no-files-found: error
          retention-days: 30

  windows-native:
    needs: windows-ffi
    runs-on: windows-2025
    timeout-minutes: 110
    env:
      MILA_TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.MILA_TAILSCALE_OAUTH_CLIENT_ID }}
      # Every Buck2 call passes the same -c, so the daemon keeps one config.
      MILA_FFI_SHA256: ${{ needs.windows-ffi.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Verify native client is independent of Flutter
        shell: pwsh
        run: |
          # Contract and README text mentions Flutter by design; inspect only
          # source and project files for accidental runtime dependencies.
          $matches = Get-ChildItem -Path mila/windows-dotnet -Recurse -File |
            Where-Object { $_.Extension -in '.cs', '.csproj', '.h', '.cpp', '.c', '.rs', '.props', '.targets', '.json', '.dll' } |
            ForEach-Object {
              Select-String -LiteralPath $_.FullName -Pattern 'flutter' -CaseSensitive:$false
            }
          if ($matches) {
            $matches | ForEach-Object { $_.ToString() }
            throw 'Windows native client must remain independent of Flutter'
          }
      # The published DLL from the Linux job, checked against its digest.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mila-windows-ffi
          path: mila/build/windows-ffi-gnu
      - name: Verify the published DLL
        shell: bash
        run: |
          test -n "$MILA_FFI_SHA256"
          cd mila/build/windows-ffi-gnu
          sha256sum -c SHA256SUMS
          echo "$MILA_FFI_SHA256  mila_ffi.dll" | sha256sum -c
      # No Nix here: `tools/buck2 --no-nix` downloads the pinned buck2 and
      # prelude (hashes from the pin registry) and builds only non_hermetic
      # targets. The daemon starts here and keeps this step's PATH.
      - name: Materialise the Buck2 cells
        shell: bash
        timeout-minutes: 10
        run: |
          dotnet_version=$(cd mila/windows-dotnet && dotnet --version)
          case "$dotnet_version" in 10.*) ;; *) echo "Mila requires the latest .NET 10 SDK, found $dotnet_version" >&2; exit 1 ;; esac
          tools/buck2 --no-nix --version
      # NuGet restores in locked mode (packages.lock.json); the build stages
      # the published DLL (//mila:windows-ffi-published, which enforces the
      # digest) as mila/windows-dotnet/bin/Release/<tfm>/win-x64/mila_native.dll.
      - name: Build native WinUI client (.NET 10)
        shell: bash
        run: tools/buck2 --no-nix build -c "mila.windows_ffi_sha256=$MILA_FFI_SHA256" //mila:windows-dotnet

      - name: Package and audit native Windows artifacts
        shell: bash
        run: tools/buck2 --no-nix build -c "mila.windows_ffi_sha256=$MILA_FFI_SHA256" //mila:windows-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-windows-native
          path: mila/build/windows-release/
          retention-days: 7
          if-no-files-found: error

      - name: Invoke staged Rust DLL through production .NET interop
        shell: bash
        run: tools/buck2 --no-nix build -c "mila.windows_ffi_sha256=$MILA_FFI_SHA256" //mila:windows-smoke

      # UI Automation over the built WinUI client's deployment picker: the
      # ListView shows the seeded store, Forget updates it, and the selection
      # drives the sign-in target (mila/windows-dotnet-uia). It runs before
      # the fixture journey so its seeded store and its loopback port 443
      # listener never meet the journey's state; it prints the desktop it ran on.
      - name: Drive the WinUI deployment picker through UI Automation
        shell: bash
        timeout-minutes: 15
        run: tools/buck2 --no-nix build -c "mila.windows_ffi_sha256=$MILA_FFI_SHA256" //mila:windows-uia

      # Journey mode drives the staged Rust session against the hermetic
      # Marshall+Porsche fixture through its descriptor (version 1: deployment
      # host/ports, inline CA, approver hook, seed). It is gated until the
      # fixture tunnel step lands and writes MILA_JOURNEY_DESCRIPTOR, so the job
      # stays green without a backend; once enabled a missing descriptor fails.
      - name: Join the Mila CI tailnet
        if: env.MILA_TAILSCALE_OAUTH_CLIENT_ID != ''
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ env.MILA_TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.MILA_TAILSCALE_OAUTH_SECRET }}
          tags: tag:mila-ci
          hostname: mila-windows-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Forward the tailnet fixture to localhost
        if: env.MILA_TAILSCALE_OAUTH_CLIENT_ID != ''
        timeout-minutes: 65
        shell: bash
        run: .github/scripts/mila-tailnet-fixture.sh "$RUNNER_TEMP/mila-journey-descriptor.json"
      - name: Windows journey against the tunnelled fixture
        id: windows-journey
        if: ${{ vars.MILA_WINDOWS_JOURNEY == 'enabled' || env.MILA_TAILSCALE_OAUTH_CLIENT_ID != '' }}
        shell: pwsh
        env:
          MILA_JOURNEY_DESCRIPTOR: ${{ runner.temp }}/mila-journey-descriptor.json
        run: |
          if (-not (Test-Path $env:MILA_JOURNEY_DESCRIPTOR)) { throw "Journey fixture descriptor missing: $env:MILA_JOURNEY_DESCRIPTOR" }
          $staged = Join-Path $env:GITHUB_WORKSPACE "mila/windows-dotnet/bin/Release/net10.0-windows10.0.19041.0/win-x64/mila_native.dll"
          dotnet run --project mila/windows-dotnet-smoke --configuration Release -p:MilaNativeDll=$staged -- --descriptor $env:MILA_JOURNEY_DESCRIPTOR
          if ($LASTEXITCODE -ne 0) { throw "Windows fixture journey failed" }
      # An explicit result lets the fixture job stop once every journey ended.
      - name: Report the journey result to the tailnet fixture
        if: always() && env.MILA_TAILSCALE_OAUTH_CLIENT_ID != ''
        shell: bash
        env:
          OUTCOME: ${{ steps.windows-journey.outcome }}
          NODE: mila-windows-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if ! address=$(cat "$RUNNER_TEMP/mila-tailnet-fixture-address" 2>/dev/null); then
            echo "no tunnelled fixture was reached; nothing to report"
            exit 0
          fi
          curl -sS --max-time 10 -X POST "http://$address:8445/finished/$NODE/${OUTCOME:-skipped}" || true

  # The hermetic Marshall+Porsche journey fixture (ADR-0264), built once per
  # run where the Namespace remote cache (ADR-0276) is reachable and pushed to
  # the public overalls Cachix cache. The GitHub-hosted KVM jobs below
  # (linux-native, android-emulator, journey-fixture-tailnet) realise `path`
  # from Cachix. Before tools/buck2 looked up the cache endpoints through the
  # cells' pinned nsc (ADR-0276, 2026-11-02) they had no live endpoint and
  # compiled the Marshall and Porsche releases from scratch (run
  # 41335763927); their Buck2 fallback now reads the cache, cache-only. The 4-vCPU profile suffices for a cache-hit build and
  # keeps the shared 64-vCPU cap free for CI. Without the Cachix token (fork
  # pull requests) nothing could be published, so the job builds nothing,
  # `path` stays empty and the consumers build locally.
  journey-fixture:
    runs-on: namespace-profile-cached-amd64;container.privileged=true
    timeout-minutes: 60
    outputs:
      path: ${{ steps.build.outputs.path }}
    env:
      NAMESPACE_RBE_TOKEN: ${{ secrets.NAMESPACE_RBE_TOKEN }}
      CACHIX_CONFIGURED: ${{ secrets.CACHIX_AUTH_TOKEN != '' }}
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
      - name: Decide whether to publish the journey fixture
        id: plan
        run: |
          if ! grep -qs 'name = "journey-fixture"' mila/BUCK; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "mila-journey-fixture is not declared; nothing to publish"
          elif [[ "$CACHIX_CONFIGURED" != true ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "CACHIX_AUTH_TOKEN is not available; the journey jobs build the fixture locally"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/devenv
        if: steps.plan.outputs.publish == 'true'
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          install-devenv: "false"
      - name: Build and push hermetic journey fixture
        id: build
        if: steps.plan.outputs.publish == 'true'
        timeout-minutes: 45
        run: |
          set -euo pipefail
          # nix_assemble's Buck2 output is a file naming the store path that
          # lib.assemble built (ADR-0269); watch-exec pushes what it realises.
          # The second, already-built call only reports the output, apart from
          # watch-exec's own output.
          cachix watch-exec overalls -- tools/buck2 build //:package-mila-journey-fixture
          path=$(cat "$(tools/buck2 build //:package-mila-journey-fixture --show-full-simple-output)")
          tools/buck2 kill
          tools/namespace-token-scan
          [[ "$path" == /nix/store/* ]] || { echo "unexpected fixture output: $path" >&2; exit 1; }
          test -x "$path/bin/mila-journey-fixture"
          # Push the whole closure: watch-exec sees only what this build
          # realised, not paths an earlier job left on the cache volume.
          cachix push overalls "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "mila-journey-fixture: \`$path\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Check Buck2 state for the Namespace token
        if: always() && steps.plan.outputs.publish == 'true'
        run: tools/namespace-token-scan

  # @cc [owner:ghuntley,label:verification] mila-managed-smoke-required
  # The native gate MUST require the Linux managed smoke target to pass using
  # the .NET SDK declared in mila/windows-dotnet/global.json.
  linux-managed:
    name: Linux managed adapter and ABI smoke
    runs-on: namespace-profile-cached-amd64-xl;container.privileged=true
    timeout-minutes: 60
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
      - uses: ./.github/actions/devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          install-devenv: "false"
      - name: Install the Windows project's .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: mila/windows-dotnet/global.json
      - name: Run managed adapter and ABI smoke tests
        run: tools/buck2 build -c overalls.non_hermetic=true //mila:linux-managed-smoke

  linux-native:
    needs: journey-fixture
    # A failed or skipped fixture job leaves `path` empty; the fixture step
    # then builds locally, so the native checks still run.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NAMESPACE_RBE_TOKEN: ${{ secrets.NAMESPACE_RBE_TOKEN }}
      OVERALLS_BUCK2_REMOTE_EXECUTION: "off"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install Nix for native packages and journeys
        uses: cachix/install-nix-action@9aaadd8b85853f67fcdf488e6a4e9efa94ee96e2
      - name: Configure Cachix for native packages and journeys
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: overalls
          extraPullNames: devenv
          useDaemon: false
      - name: Build and verify Rust and native GTK packages through Buck2
        run: |
          set -euo pipefail
          tools/buck2 build //:check-mila-rust //:package-tool-mila-linux-native
          out=$(tools/buck2 build //:package-tool-mila-linux-journeys --show-full-simple-output)
          package=$(cat "$out")
          test -x "$package/bin/mila"
          test -x "$package/bin/mila-linux-journey"
          test -x "$package/bin/mila-broadwayd"
          echo "MILA_LINUX_JOURNEY_PACKAGE=$package" >> "$GITHUB_ENV"
      - name: GTK journey wiring smoke (unreachable deployment)
        # Drives the real window's Sign in button with no deployment behind
        # it: the window's driver must create the device key, attempt the
        # profile's HTTPS trust fetch and report the typed failure.
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/mila-gtk-smoke"
          mkdir -m 700 "$dir"
          cat > "$dir/descriptor.json" <<'JSON'
          {"version":1,"deployment":{"host":"unreachable.invalid","ssh_port":2222,"https_port":8443},
           "tls":{"ca_pem":"-----BEGIN CERTIFICATE-----\nMIIB\n-----END CERTIFICATE-----","server_name":"unreachable.invalid"},
           "approver":{"url":"https://unreachable.invalid:8443/approve","bearer_token":"smoke"},
           "seed":{"machine_name":"journey-machine","share_principal":"second@example.test"}}
          JSON
          "$MILA_LINUX_JOURNEY_PACKAGE/bin/mila-broadwayd" :6 &
          broadway=$!
          trap 'kill "$broadway" 2>/dev/null || true' EXIT
          python3 -I - <<'PY'
          import socket
          import time

          deadline = time.monotonic() + 10
          while time.monotonic() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 8086), timeout=0.1):
                      break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit("GTK smoke display did not start")
          PY
          status=0
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:6 GSETTINGS_BACKEND=memory \
            tools/buck2 run //mila:linux-gtk-journey -- --gtk-journey "$dir/descriptor.json" \
            > "$dir/report.json" || status=$?
          cat "$dir/report.json"
          test "$status" -eq 1
          python3 -I - "$dir/report.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              report: object = json.load(handle)
          steps = report.get("steps") if isinstance(report, dict) else None
          expected = [
              {"name": "gtk_deployments_add", "ok": True, "outcome": "two_listed"},
              {"name": "gtk_deployment_select", "ok": True, "outcome": "selected"},
              {"name": "gtk_sign_in", "ok": False, "outcome": "host_untrusted"},
          ]
          if steps != expected:
              raise SystemExit(f"unexpected GTK journey smoke report: {steps!r}")
          PY
      # The hermetic Marshall+Porsche journey fixture runs on this runner.
      # Every fixture step is gated on `//mila:journey-fixture` existing,
      # so the job stays green (journey skipped) without the fixture.
      - name: Detect hermetic journey fixture
        id: journey
        run: |
          if grep -qs 'name = "journey-fixture"' mila/BUCK; then
            echo "declared=true" >> "$GITHUB_OUTPUT"
          else
            echo "declared=false" >> "$GITHUB_OUTPUT"
            echo "mila-journey-fixture is not declared; journey skipped"
          fi
      # The fixture launcher boots a KVM QEMU VM and refuses to fall back to TCG.
      - name: Enable KVM for the journey fixture
        if: steps.journey.outputs.declared == 'true'
        timeout-minutes: 5
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # A local fixture build runs mix_release in bwrap with its own
          # network namespace; Ubuntu 24.04's AppArmor userns restriction
          # refuses that ("bwrap: loopback: Failed RTM_NEWADDR").
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          test -r /dev/kvm -a -w /dev/kvm
      # Realising first keeps substitution/build time apart from VM startup.
      - name: Realise hermetic journey fixture
        id: fixture
        if: steps.journey.outputs.declared == 'true'
        timeout-minutes: 40
        env:
          FIXTURE_PATH: ${{ needs.journey-fixture.outputs.path }}
          # Only the local fallback below runs Buck2. tools/buck2 looks up the
          # Namespace cache endpoints with the token through the cells' pinned
          # nsc (ADR-0276), so the fallback reads the cache; cache-only, so a
          # GitHub-hosted runner never starts Namespace workers.
          NAMESPACE_RBE_TOKEN: ${{ secrets.NAMESPACE_RBE_TOKEN }}
          OVERALLS_BUCK2_REMOTE_EXECUTION: "off"
        run: |
          set -euo pipefail
          # The journey-fixture job's store path, substituted from Cachix. A
          # local Buck2 build, reading the Namespace cache where the token is
          # available, covers a missing path: fork pull requests (no token, so
          # slow), or a failed or skipped publish.
          if [[ "$FIXTURE_PATH" == /nix/store/* ]] &&
            nix-store --realise "$FIXTURE_PATH" --add-root "$RUNNER_TEMP/mila-journey-fixture" > /dev/null; then
            echo "Realised $FIXTURE_PATH from Cachix"
          else
            echo "::warning::journey fixture not published; building it locally with Buck2"
            out=$(tools/buck2 build //:package-mila-journey-fixture --show-full-simple-output)
            ln -sfn "$(cat "$out")" "$RUNNER_TEMP/mila-journey-fixture"
            tools/buck2 kill
            tools/namespace-token-scan
          fi
          test -x "$RUNNER_TEMP/mila-journey-fixture/bin/mila-journey-fixture"
          echo "built=true" >> "$GITHUB_OUTPUT"
      - name: Start hermetic journey fixture
        if: steps.fixture.outputs.built == 'true'
        timeout-minutes: 25
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/mila-journey"
          mkdir -p "$dir/state"
          chmod 700 "$dir"
          nohup "$RUNNER_TEMP/mila-journey-fixture/bin/mila-journey-fixture" \
            --descriptor "$dir/descriptor.json" --state "$dir/state" \
            > "$dir/fixture.log" 2>&1 &
          echo "$!" > "$dir/fixture.pid"
          for _ in $(seq 1 1500); do
            if python3 -I -c 'import json, sys; json.load(open(sys.argv[1], encoding="utf-8"))' "$dir/descriptor.json" 2>/dev/null; then
              break
            fi
            if ! kill -0 "$(cat "$dir/fixture.pid")" 2>/dev/null; then
              echo 'fixture_launcher_exited=true' >&2
              exit 1
            fi
            sleep 1
          done
          python3 -I - "$dir/descriptor.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              document: object = json.load(handle)
          approver = document.get("approver") if isinstance(document, dict) else None
          token = approver.get("bearer_token") if isinstance(approver, dict) else None
          if not isinstance(token, str) or not token:
              raise SystemExit("journey descriptor lacks approver.bearer_token")
          print(f"::add-mask::{token}")
          PY
          echo "MILA_JOURNEY_DESCRIPTOR=$dir/descriptor.json" >> "$GITHUB_ENV"
      # The launcher prints its descriptor, so its log must remain private.
      - name: Report journey fixture startup status
        if: failure() && steps.fixture.outputs.built == 'true'
        run: |
          dir="$RUNNER_TEMP/mila-journey"
          if test -s "$dir/descriptor.json"; then
            echo 'fixture_descriptor_ready=true'
          else
            echo 'fixture_descriptor_ready=false'
          fi
      - name: Linux journeys against the hermetic fixture
        if: env.MILA_JOURNEY_DESCRIPTOR != ''
        # Fixture hooks may each take up to 330 s under host load.
        timeout-minutes: 30
        run: |
          set -euo pipefail
          # Run both journeys even when the first fails, so each prints its report.
          status=0
          tools/buck2 run //mila:linux-journey -- --descriptor "$MILA_JOURNEY_DESCRIPTOR" || status=$?
          "$MILA_LINUX_JOURNEY_PACKAGE/bin/mila-broadwayd" :7 &
          broadway=$!
          trap 'kill "$broadway" 2>/dev/null || true' EXIT
          python3 -I - <<'PY'
          import socket
          import time

          deadline = time.monotonic() + 10
          while time.monotonic() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 8087), timeout=0.1):
                      break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit("GTK journey display did not start")
          PY
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:7 GSETTINGS_BACKEND=memory \
            tools/buck2 run //mila:linux-gtk-journey -- --gtk-journey "$MILA_JOURNEY_DESCRIPTOR" || status=$?
          exit "$status"
      - name: Check Buck2 state for the Namespace token
        if: always()
        run: tools/namespace-token-scan

  # The APKs build on macOS; android-emulator runs them on Linux, because an
  # Apple Silicon macOS VM has neither KVM for the fixture VM nor nested
  # virtualisation for an Android emulator.
  android-native:
    runs-on: namespace-profile-cached-arm64
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@138b5fb1cf087fdb4c5f3c621466fe304d0cf2e3 # v4.0.4
        timeout-minutes: 10
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        timeout-minutes: 15
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1
        timeout-minutes: 5
        with:
          gradle-version: '9.3.1'
      - name: Install Rust Android linker
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: clippy
      - name: Install cargo-ndk
        timeout-minutes: 10
        run: cargo install cargo-ndk --locked --version 4.1.2
      # tools/buck2 builds buckCells.aarch64-darwin, as in apple-native.
      - name: Setup Nix
        uses: cachix/install-nix-action@9aaadd8b85853f67fcdf488e6a4e9efa94ee96e2
      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: overalls
          extraPullNames: devenv
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false
      # Bounded so a cold cells build fails well inside the job timeout. The
      # daemon starts here and keeps this step's PATH and environment (JDK,
      # Gradle, ANDROID_HOME, ANDROID_NDK_HOME, cargo-ndk).
      - name: Materialise the Buck2 cells
        timeout-minutes: 20
        run: tools/buck2 --version
      # Buck2 targets (ADR-0269 M9) over the SDKs above: Clippy of the
      # Android FFI library, then the debug and test APKs and unit tests.
      # Gradle verifies every dependency against gradle/verification-metadata.xml.
      - name: Clippy the Android FFI
        timeout-minutes: 30
        run: tools/buck2 build -c overalls.non_hermetic=true //mila:android-ffi-clippy
      # Gradle resolves into the Gradle User Home that setup-gradle restores and
      # saves, so the ~200 MB Robolectric SDK jar is downloaded only on a cache
      # miss. Maven repositories rate-limit runners (429 in run 41287426560), so
      # a build that failed only to download is retried with backoff: the jars
      # already fetched stay in the Gradle cache, and the pinned sha256 values
      # in gradle/verification-metadata.xml still decide what is accepted.
      - name: Assemble native Compose APKs
        timeout-minutes: 45
        run: |
          set -euo pipefail
          for delay in 60 180 0; do
            status=0
            tools/buck2 build -c overalls.non_hermetic=true //mila:android-debug --show-full-output \
              > "$RUNNER_TEMP/android-debug.txt" 2> "$RUNNER_TEMP/android-debug.err" || status=$?
            cat "$RUNNER_TEMP/android-debug.err" >&2
            if [ "$status" -eq 0 ]; then
              break
            fi
            if [ "$delay" -eq 0 ] || ! grep -qE 'Received status code (429|5[0-9][0-9])|Could not (GET|HEAD) .https://' "$RUNNER_TEMP/android-debug.err"; then
              exit 1
            fi
            echo "::warning::Gradle download failed (rate limit or server error); retrying in ${delay}s"
            sleep "$delay"
          done
          cat "$RUNNER_TEMP/android-debug.txt"
          out=$(awk 'END { print $2 }' "$RUNNER_TEMP/android-debug.txt")
          mkdir -p "$RUNNER_TEMP/mila-android-apks"
          cp -L "$out"/* "$RUNNER_TEMP/mila-android-apks/"
          cd "$RUNNER_TEMP/mila-android-apks"
          shasum -a 256 -c SHA256SUMS
          test -f app-debug.apk -a -f app-debug-androidTest.apk
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: mila-android-debug-apks
          path: ${{ runner.temp }}/mila-android-apks/
          if-no-files-found: error
          retention-days: 7

  # Runs the APKs android-native built on an x86_64 API 35 emulator beside the
  # hermetic journey fixture. Both need /dev/kvm, so this job stays on Linux.
  android-emulator:
    needs: [android-native, journey-fixture]
    # Runs whenever the APKs exist; without a published fixture path the
    # fixture step builds locally.
    if: ${{ !cancelled() && needs.android-native.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Enable KVM for the Android emulator
        id: enable-kvm
        continue-on-error: true
        timeout-minutes: 5
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # A local fixture build runs mix_release in bwrap with its own
          # network namespace; Ubuntu 24.04's AppArmor userns restriction
          # refuses that ("bwrap: loopback: Failed RTM_NEWADDR").
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          if ! test -r /dev/kvm -a -w /dev/kvm; then
            echo 'KVM unavailable; emulator runner will use software acceleration'
          fi
      # The hermetic Marshall+Porsche journey fixture (ADR-0264) is substituted from
      # Cachix and built first, then boots beside the emulator on this runner.
      # Every fixture step is gated on `//mila:journey-fixture` existing.
      - name: Detect hermetic journey fixture
        id: journey
        run: |
          if grep -qs 'name = "journey-fixture"' mila/BUCK; then
            echo "declared=true" >> "$GITHUB_OUTPUT"
          else
            echo "declared=false" >> "$GITHUB_OUTPUT"
            echo "mila-journey-fixture is not declared; journey skipped"
          fi
      - name: Install Nix for the journey fixture
        if: steps.journey.outputs.declared == 'true'
        uses: cachix/install-nix-action@9aaadd8b85853f67fcdf488e6a4e9efa94ee96e2
      # The journey-fixture job pushes the fixture closure (Marshall, Porsche,
      # PostgreSQL) to the public overalls cache, so pulling needs no token.
      - name: Configure Cachix for the journey fixture
        if: steps.journey.outputs.declared == 'true'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: overalls
          extraPullNames: devenv
          useDaemon: false
      # Realising first keeps substitution/build time apart from VM startup; the
      # VM boots just before the emulator.
      - name: Realise hermetic journey fixture
        id: fixture
        if: steps.journey.outputs.declared == 'true'
        timeout-minutes: 40
        env:
          FIXTURE_PATH: ${{ needs.journey-fixture.outputs.path }}
          # Only the local fallback below runs Buck2. tools/buck2 looks up the
          # Namespace cache endpoints with the token through the cells' pinned
          # nsc (ADR-0276), so the fallback reads the cache; cache-only, so a
          # GitHub-hosted runner never starts Namespace workers.
          NAMESPACE_RBE_TOKEN: ${{ secrets.NAMESPACE_RBE_TOKEN }}
          OVERALLS_BUCK2_REMOTE_EXECUTION: "off"
        run: |
          set -euo pipefail
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "/dev/kvm unavailable; the fixture never falls back to TCG, journey skipped"
            exit 0
          fi
          # The VM closure and the Android SDK do not both fit the runner's default free space.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
          # The journey-fixture job's store path, substituted from Cachix. A
          # local Buck2 build, reading the Namespace cache where the token is
          # available, covers a missing path: fork pull requests (no token, so
          # slow), or a failed or skipped publish.
          if [[ "$FIXTURE_PATH" == /nix/store/* ]] &&
            nix-store --realise "$FIXTURE_PATH" --add-root "$RUNNER_TEMP/mila-journey-fixture" > /dev/null; then
            echo "Realised $FIXTURE_PATH from Cachix"
          else
            echo "::warning::journey fixture not published; building it locally with Buck2"
            out=$(tools/buck2 build //:package-mila-journey-fixture --show-full-simple-output)
            ln -sfn "$(cat "$out")" "$RUNNER_TEMP/mila-journey-fixture"
            tools/buck2 kill
            tools/namespace-token-scan
          fi
          test -x "$RUNNER_TEMP/mila-journey-fixture/bin/mila-journey-fixture"
          echo "built=true" >> "$GITHUB_OUTPUT"
      - uses: android-actions/setup-android@138b5fb1cf087fdb4c5f3c621466fe304d0cf2e3 # v4.0.4
        continue-on-error: true
        timeout-minutes: 10
        with:
          # Preinstall the emulator and image so reactivecircus does not
          # fetch the moving "latest" archive during the test step.
          packages: >-
            platform-tools
            emulator
            platforms;android-35
            system-images;android-35;google_apis;x86_64
      - name: Ensure Android SDK packages
        timeout-minutes: 15
        run: |
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          export ANDROID_HOME
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || test -x "$(command -v sdkmanager)"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mila-android-debug-apks
          path: ${{ runner.temp }}/mila-android-apks
      - name: Verify the downloaded APKs
        working-directory: ${{ runner.temp }}/mila-android-apks
        run: sha256sum -c SHA256SUMS
      - name: Start hermetic journey fixture
        if: steps.fixture.outputs.built == 'true'
        timeout-minutes: 25
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/mila-journey"
          mkdir -p "$dir/state"
          chmod 700 "$dir" "$dir/state"
          # The launcher keeps the VM up for the rest of the job. Its output can repeat the
          # descriptor, which carries the approver bearer, so it stays in the owner-only directory.
          nohup "$RUNNER_TEMP/mila-journey-fixture/bin/mila-journey-fixture" \
            --descriptor "$dir/descriptor.json" --state "$dir/state" \
            > "$dir/fixture.log" 2>&1 &
          echo "$!" > "$dir/fixture.pid"
          for _ in $(seq 1 1500); do
            if python3 -I -c 'import json, sys; json.load(open(sys.argv[1], encoding="utf-8"))' "$dir/descriptor.json" 2>/dev/null; then
              break
            fi
            if ! kill -0 "$(cat "$dir/fixture.pid")" 2>/dev/null; then
              echo "mila-journey-fixture exited before publishing a descriptor" >&2
              exit 1
            fi
            sleep 1
          done
          python3 -I - "$dir/descriptor.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              document: object = json.load(handle)
          approver = document.get("approver") if isinstance(document, dict) else None
          token = approver.get("bearer_token") if isinstance(approver, dict) else None
          if not isinstance(token, str) or not token:
              raise SystemExit("journey descriptor lacks approver.bearer_token")
          print(f"::add-mask::{token}")
          PY
          echo "MILA_JOURNEY_DESCRIPTOR=$dir/descriptor.json" >> "$GITHUB_ENV"
      - name: Invoke packaged Rust JNI on Android
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          MILA_ANDROID_APK_DIR: ${{ runner.temp }}/mila-android-apks
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          force-avd-creation: true
          emulator-boot-timeout: 900
          disable-linux-hw-accel: auto
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: mila/native/android
          disable-animations: true
          # Runs the packaged suite, then the fixture journey when MILA_JOURNEY_DESCRIPTOR is set.
          script: bash scripts/run-instrumentation.sh
      # The fixture logs carry no credentials: the bearer is only in descriptor.json.
      - name: Show journey fixture logs
        if: failure() && steps.fixture.outputs.built == 'true'
        run: |
          dir="$RUNNER_TEMP/mila-journey"
          tail -n 200 "$dir/fixture.log" || true
          tail -n 200 "$dir/state/console.log" || true

  # Tunnelled fixture host (ADR-0264). Boots the hermetic backend bound to
  # this runner's tailnet address and serves only the descriptor beside it
  # until the Apple and Windows journey nodes have joined and left (or a
  # deadline passes). Skipped cleanly without MILA_TAILSCALE_OAUTH_CLIENT_ID.
  journey-fixture-tailnet:
    # windows-native waits for windows-ffi, which can queue for half an hour.
    # Starting the fixture alongside windows-ffi's result keeps the Windows node
    # inside the fixture's join window (run 41273848008 missed it). The Apple
    # journey waits for the fixture for up to 60 minutes. journey-fixture runs
    # beside windows-ffi and usually finishes first.
    needs: [windows-ffi, journey-fixture]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    env:
      MILA_TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.MILA_TAILSCALE_OAUTH_CLIENT_ID }}
      PEERS: mila-apple-${{ github.run_id }}-${{ github.run_attempt }} mila-windows-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Skip without the tailnet secret
        if: env.MILA_TAILSCALE_OAUTH_CLIENT_ID == ''
        run: echo "MILA_TAILSCALE_OAUTH_CLIENT_ID is not configured; tunnelled fixture skipped"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: env.MILA_TAILSCALE_OAUTH_CLIENT_ID != ''
      - name: Install Nix for the journey fixture
        if: env.MILA_TAILSCALE_OAUTH_CLIENT_ID != ''
        uses: cachix/install-nix-action@9aaadd8b85853f67fcdf488e6a4e9efa94ee96e2
      # The journey-fixture job pushes the fixture closure (Marshall, Porsche,
      # PostgreSQL) to the public overalls cache, so pulling needs no token.
      - name: Configure Cachix for the journey fixture
        if: env.MILA_TAILSCALE_OAUTH_CLIENT_ID != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: overalls
          extraPullNames: devenv
          useDaemon: false
      # Before the fixture step: a local fallback build needs the sysctl.
      - name: Enable KVM for the journey fixture
        if: env.MILA_TAILSCALE_OAUTH_CLIENT_ID != ''
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # A local fixture build runs mix_release in bwrap with its own
          # network namespace; Ubuntu 24.04's AppArmor userns restriction
          # refuses that ("bwrap: loopback: Failed RTM_NEWADDR").
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          test -r /dev/kvm -a -w /dev/kvm
      - name: Realise hermetic journey fixture
        if: env.MILA_TAILSCALE_OAUTH_CLIENT_ID != ''
        timeout-minutes: 40
        env:
          FIXTURE_PATH: ${{ needs.journey-fixture.outputs.path }}
          # Only the local fallback below runs Buck2. tools/buck2 looks up the
          # Namespace cache endpoints with the token through the cells' pinned
          # nsc (ADR-0276), so the fallback reads the cache; cache-only, so a
          # GitHub-hosted runner never starts Namespace workers.
          NAMESPACE_RBE_TOKEN: ${{ secrets.NAMESPACE_RBE_TOKEN }}
          OVERALLS_BUCK2_REMOTE_EXECUTION: "off"
        run: |
          set -euo pipefail
          # The journey-fixture job's store path, substituted from Cachix. A
          # local Buck2 build, reading the Namespace cache where the token is
          # available, covers a missing path: fork pull requests (no token, so
          # slow), or a failed or skipped publish.
          if [[ "$FIXTURE_PATH" == /nix/store/* ]] &&
            nix-store --realise "$FIXTURE_PATH" --add-root "$RUNNER_TEMP/mila-journey-fixture" > /dev/null; then
            echo "Realised $FIXTURE_PATH from Cachix"
          else
            echo "::warning::journey fixture not published; building it locally with Buck2"
            out=$(tools/buck2 build //:package-mila-journey-fixture --show-full-simple-output)
            ln -sfn "$(cat "$out")" "$RUNNER_TEMP/mila-journey-fixture"
            tools/buck2 kill
            tools/namespace-token-scan
          fi
          test -x "$RUNNER_TEMP/mila-journey-fixture/bin/mila-journey-fixture"
      - name: Join the Mila CI tailnet
        if: env.MILA_TAILSCALE_OAUTH_CLIENT_ID != ''
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ env.MILA_TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.MILA_TAILSCALE_OAUTH_SECRET }}
          tags: tag:mila-ci
          hostname: mila-fixture-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Serve the fixture on the tailnet until the journeys finish
        if: env.MILA_TAILSCALE_OAUTH_CLIENT_ID != ''
        timeout-minutes: 80
        run: |
          set -euo pipefail
          address="$(tailscale ip -4)"
          dir="$RUNNER_TEMP/mila-journey"
          mkdir -p "$dir/public" "$dir/state"
          chmod 700 "$dir"
          nohup "$RUNNER_TEMP/mila-journey-fixture/bin/mila-journey-fixture" --bind "$address" \
            --descriptor "$dir/public/descriptor.json" --state "$dir/state" \
            > "$dir/fixture.log" 2>&1 &
          fixture=$!
          for _ in $(seq 1 1500); do
            [ -s "$dir/public/descriptor.json" ] && break
            kill -0 "$fixture" 2>/dev/null || { tail -n 100 "$dir/fixture.log" >&2; exit 1; }
            sleep 1
          done
          token="$(jq -r .approver.bearer_token "$dir/public/descriptor.json")"
          echo "::add-mask::$token"
          # Only tag:mila-ci peers can reach port 8445 (see the tailnet policy). The
          # script fails fast when this node's tag or packet filter cannot admit them,
          # and stops once every journey job has reported a result or left.
          read -ra peers <<< "$PEERS"
          python3 -I .github/scripts/mila-tailnet-peers.py --bind "$address" \
            --directory "$dir/public" --deadline 3000 "${peers[@]}"
      - name: Show journey fixture logs
        if: failure() && env.MILA_TAILSCALE_OAUTH_CLIENT_ID != ''
        run: |
          dir="$RUNNER_TEMP/mila-journey"
          tail -n 200 "$dir/fixture.log" || true
          tail -n 200 "$dir/state/console.log" || true

  native-gate:
    name: Native platform gate
    if: ${{ always() }}
    needs: [apple-native, android-native, android-emulator, linux-managed, linux-native, windows-ffi, windows-native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Verify native parity and Flutter removal
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Every platform cell must open with "implemented:". The matrix also
          # records evidence limits (for example, unsigned packaging or a
          # missing physical-device receipt) in the prose of implemented rows;
          # those limits are intentionally reviewed architecture evidence and
          # are not CI status failures.
          matrix = Path("mila/native/PARITY_MATRIX.md").read_text(encoding="utf-8")
          rows = [line for line in matrix.splitlines() if line.startswith("| ") and "---" not in line]
          header, body = rows[0], rows[1:]
          platforms = [cell.strip() for cell in header.strip().strip("|").split(" | ")][2:]
          problems = []
          for row in body:
              cells = [cell.strip() for cell in row.strip().strip("|").split(" | ")]
              if len(cells) != len(platforms) + 2:
                  problems.append(f"{cells[0][:60]}: expected {len(platforms) + 2} cells, found {len(cells)}")
                  continue
              for platform, cell in zip(platforms, cells[2:]):
                  if not cell.lower().startswith("implemented:"):
                      problems.append(f"{cells[0][:60]} / {platform}: status is not implemented")
          if problems:
              print("\n".join(problems))
              raise SystemExit("parity matrix still contains open, partial or unverified cells")
          workflow = Path(".github/workflows/mila-builds.yml").read_text(encoding="utf-8")
          if any(line.lstrip().startswith("FLUTTER_VERSION:") for line in workflow.splitlines()):
              raise SystemExit("native workflow must not retain Flutter compatibility variables")
          print("Native implementation matrix is present and Flutter compatibility is removed.")
          PY
      - name: Require every native platform job to pass
        env:
          APPLE: ${{ needs.apple-native.result }}
          ANDROID: ${{ needs.android-native.result }}
          ANDROID_EMULATOR: ${{ needs.android-emulator.result }}
          LINUX_MANAGED: ${{ needs.linux-managed.result }}
          LINUX: ${{ needs.linux-native.result }}
          WINDOWS_FFI: ${{ needs.windows-ffi.result }}
          WINDOWS: ${{ needs.windows-native.result }}
        run: |
          set -eu
          for result in "$APPLE" "$ANDROID" "$ANDROID_EMULATOR" "$LINUX_MANAGED" "$LINUX" "$WINDOWS_FFI" "$WINDOWS"; do
            test "$result" = success || {
              echo "Native platform gate failed: $result" >&2
              exit 1
            }
          done
