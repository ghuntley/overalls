name: "mila builds"

# Mila's dev targets on every platform (ADR-0235). The platform builds are
# Buck2 targets (ADR-0269 M9, see the buck2 skill): Android, Apple and Windows
# build the non_hermetic //mila: targets with the runner's SDKs; macOS runs
# tools/buck2 over buckCells.aarch64-darwin, and Windows, which has no Nix,
# runs `tools/buck2 --no-nix` with the pinned buck2 and prelude.
on:
  pull_request:
    paths:
      # Root Cargo workspace manifest and its single lock (ADR-0273).
      - "Cargo.toml"
      - "Cargo.lock"
      - "mila/**"
      - "mila/rust/**"
      - "protocol/test/fixtures/**"
      - "nix/domains/artifacts/mila/**"
      - "nix/platform/dartssh2.nix"
      - "nix/platform/patches/dartssh2-*"
      - ".github/workflows/mila-builds.yml"
      # The Buck2 build of the //mila: targets (ADR-0269 M9): the wrapper and
      # its no-Nix mode, the cells and toolchains, and only the rule files
      # mila/BUCK loads (`buck2 audit includes mila/BUCK`) plus the driver.
      - "tools/buck2"
      - "tools/buck2_no_nix.py"
      - "tools/buck2-no-nix.json"
      - "toolchains/**"
      - "nix/buck/**"
      - ".buckconfig"
      - "buck/mila.bzl"
      - "buck/nix.bzl"
      - "buck/checks.bzl"
      - "buck/mila_platform.py"
  push:
    branches: [trunk]
    paths:
      # Root Cargo workspace manifest and its single lock (ADR-0273).
      - "Cargo.toml"
      - "Cargo.lock"
      - "mila/**"
      - "mila/rust/**"
      - "protocol/test/fixtures/**"
      - "nix/domains/artifacts/mila/**"
      - "nix/platform/dartssh2.nix"
      - "nix/platform/patches/dartssh2-*"
      - ".github/workflows/mila-builds.yml"
      # The Buck2 build of the //mila: targets (ADR-0269 M9): the wrapper and
      # its no-Nix mode, the cells and toolchains, and only the rule files
      # mila/BUCK loads (`buck2 audit includes mila/BUCK`) plus the driver.
      - "tools/buck2"
      - "tools/buck2_no_nix.py"
      - "tools/buck2-no-nix.json"
      - "toolchains/**"
      - "nix/buck/**"
      - ".buckconfig"
      - "buck/mila.bzl"
      - "buck/nix.bzl"
      - "buck/checks.bzl"
      - "buck/mila_platform.py"
  workflow_dispatch:

concurrency:
  group: mila-builds-${{ github.ref }}
  # Let a started run finish so trunk records a result even under a steady
  # stream of pushes; GitHub keeps only the newest pending run per group.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source-bundle:
    runs-on: namespace-profile-cached-amd64-xl;container.privileged=true
    timeout-minutes: 60
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
      - uses: ./.github/actions/devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          install-devenv: "false"
      - name: Validate shared localization catalogs
        run: |
          python3 -m unittest mila/localization/test_generate_catalogs.py
          python3 mila/localization/generate_catalogs.py \
            --source marshall/priv/gettext \
            --output "$RUNNER_TEMP/mila-localization"
          python3 mila/localization/generate_catalogs.py \
            --source mila/localization/catalogs \
            --output "$RUNNER_TEMP/mila-localization-app"
      - name: Build the source bundle
        run: |
          tools/buck2 build //:package-tool-mila-source-bundle --show-full-output | tee bundle.txt
          bundle=$(cat "$(awk 'END { print $2 }' bundle.txt)")
          mkdir -p out
          cp -L "$bundle"/* out/
          (cd out && sha256sum -c SHA256SUMS)
      - name: Build the native Windows source bundle
        run: |
          tools/buck2 build //:package-tool-mila-windows-source-bundle --show-full-output | tee windows-bundle.txt
          bundle=$(cat "$(awk 'END { print $2 }' windows-bundle.txt)")
          mkdir -p out-windows
          cp -L "$bundle"/* out-windows/
          (cd out-windows && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: mila-source-bundle
          path: out/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: mila-windows-source-bundle
          path: out-windows/
          if-no-files-found: error
          retention-days: 7

  apple-native:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      MILA_TAILSCALE_AUTHKEY: ${{ secrets.MILA_TAILSCALE_AUTHKEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # tools/buck2 builds buckCells.aarch64-darwin: buck2, the prelude and a
      # few host tools, substituted from Cachix (the patched nixpkgs source
      # from devenv's cache); a miss builds three small derivations.
      - name: Setup Nix
        uses: cachix/install-nix-action@9aaadd8b85853f67fcdf488e6a4e9efa94ee96e2
      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: overalls
          extraPullNames: devenv
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false
      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-ios-sim
          components: clippy
      # Bounded so a cold cells build fails well inside the job timeout. The
      # daemon starts here and keeps this step's PATH (cargo, Xcode).
      - name: Materialise the Buck2 cells
        timeout-minutes: 20
        run: tools/buck2 --version
      - name: Build Rust FFI for Apple native tests
        run: tools/buck2 build -c overalls.non_hermetic=true //mila:apple-ffi
      - name: Clippy the Rust FFI
        run: tools/buck2 build -c overalls.non_hermetic=true //mila:apple-ffi-clippy
      # Generates the bundled locale catalogs, then runs swift test against
      # the FFI above.
      - name: Swift native package tests
        run: tools/buck2 build -c overalls.non_hermetic=true //mila:apple-swift-test
      - name: Apple app InfoPlist localization tests
        run: python3 -m unittest mila/localization/test_apple_infoplist_strings.py
      # The package declares iOS support, so build the app for both platforms;
      # swift test alone compiles only the macOS slice.
      - name: Build the macOS dev app
        run: tools/buck2 build -c overalls.non_hermetic=true //mila:macos-dev
      - name: Build the iOS-simulator dev app
        run: tools/buck2 build -c overalls.non_hermetic=true //mila:ios-dev
      # Tunnelled fixture (ADR-0264): the Linux `journey-fixture-tailnet` job
      # serves the hermetic backend on the tailnet. Skipped without the secret.
      - name: Join the Mila CI tailnet
        if: env.MILA_TAILSCALE_AUTHKEY != ''
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          authkey: ${{ env.MILA_TAILSCALE_AUTHKEY }}
          tags: tag:mila-ci
          hostname: mila-apple-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Forward the tailnet fixture to localhost
        if: env.MILA_TAILSCALE_AUTHKEY != ''
        timeout-minutes: 65
        run: .github/scripts/mila-tailnet-fixture.sh "$RUNNER_TEMP/mila-journey-descriptor.json"
      - name: Apple journey against the tunnelled fixture
        id: apple-journey
        if: env.MILA_TAILSCALE_AUTHKEY != ''
        working-directory: mila/native/apple
        timeout-minutes: 20
        env:
          MILA_FFI_LIB_DIR: ${{ github.workspace }}/mila/rust/target/release
          MILA_JOURNEY_DESCRIPTOR: ${{ runner.temp }}/mila-journey-descriptor.json
        run: swift test --filter MilaJourneyTests
      # An explicit result lets the fixture job stop once every journey ended.
      - name: Report the journey result to the tailnet fixture
        if: always() && env.MILA_TAILSCALE_AUTHKEY != ''
        shell: bash
        env:
          OUTCOME: ${{ steps.apple-journey.outcome }}
          NODE: mila-apple-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if ! address=$(cat "$RUNNER_TEMP/mila-tailnet-fixture-address" 2>/dev/null); then
            echo "no tunnelled fixture was reached; nothing to report"
            exit 0
          fi
          curl -sS --max-time 10 -X POST "http://$address:8445/finished/$NODE/${OUTCOME:-skipped}" || true

  windows-native:
    runs-on: windows-2025
    timeout-minutes: 110
    env:
      MILA_TAILSCALE_AUTHKEY: ${{ secrets.MILA_TAILSCALE_AUTHKEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Verify native client is independent of Flutter
        shell: pwsh
        run: |
          # Contract and README text mentions Flutter by design; inspect only
          # source and project files for accidental runtime dependencies.
          $matches = Get-ChildItem -Path mila/windows-dotnet -Recurse -File |
            Where-Object { $_.Extension -in '.cs', '.csproj', '.h', '.cpp', '.c', '.rs', '.props', '.targets', '.json', '.dll' } |
            ForEach-Object {
              Select-String -LiteralPath $_.FullName -Pattern 'flutter' -CaseSensitive:$false
            }
          if ($matches) {
            $matches | ForEach-Object { $_.ToString() }
            throw 'Windows native client must remain independent of Flutter'
          }
      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.1
          components: clippy
      # No Nix here: `tools/buck2 --no-nix` downloads the pinned buck2 and
      # prelude (hashes from the pin registry) and builds only non_hermetic
      # targets. The daemon starts here and keeps this step's PATH.
      - name: Materialise the Buck2 cells
        shell: bash
        timeout-minutes: 10
        run: |
          dotnet_version=$(cd mila/windows-dotnet && dotnet --version)
          case "$dotnet_version" in 10.*) ;; *) echo "Mila requires the latest .NET 10 SDK, found $dotnet_version" >&2; exit 1 ;; esac
          tools/buck2 --no-nix --version
      - name: Build Rust Windows FFI
        shell: bash
        run: tools/buck2 --no-nix build //mila:windows-ffi-msvc
      - name: Clippy the Rust FFI
        shell: bash
        run: tools/buck2 --no-nix build //mila:windows-ffi-msvc-clippy
      # NuGet restores in locked mode (packages.lock.json); the build stages
      # the MSVC DLL as mila/windows-dotnet/bin/Release/<tfm>/win-x64/mila_native.dll.
      - name: Build native WinUI client (.NET 10)
        shell: bash
        run: tools/buck2 --no-nix build //mila:windows-dotnet

      - name: Invoke staged Rust DLL through production .NET interop
        shell: bash
        run: tools/buck2 --no-nix build //mila:windows-smoke

      # Journey mode drives the staged Rust session against the hermetic
      # Marshall+Porsche fixture through its descriptor (version 1: deployment
      # host/ports, inline CA, approver hook, seed). It is gated until the
      # fixture tunnel step lands and writes MILA_JOURNEY_DESCRIPTOR, so the job
      # stays green without a backend; once enabled a missing descriptor fails.
      - name: Join the Mila CI tailnet
        if: env.MILA_TAILSCALE_AUTHKEY != ''
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          authkey: ${{ env.MILA_TAILSCALE_AUTHKEY }}
          tags: tag:mila-ci
          hostname: mila-windows-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Forward the tailnet fixture to localhost
        if: env.MILA_TAILSCALE_AUTHKEY != ''
        timeout-minutes: 65
        shell: bash
        run: .github/scripts/mila-tailnet-fixture.sh "$RUNNER_TEMP/mila-journey-descriptor.json"
      - name: Windows journey against the tunnelled fixture
        id: windows-journey
        if: ${{ vars.MILA_WINDOWS_JOURNEY == 'enabled' || env.MILA_TAILSCALE_AUTHKEY != '' }}
        shell: pwsh
        env:
          MILA_JOURNEY_DESCRIPTOR: ${{ runner.temp }}/mila-journey-descriptor.json
        run: |
          if (-not (Test-Path $env:MILA_JOURNEY_DESCRIPTOR)) { throw "Journey fixture descriptor missing: $env:MILA_JOURNEY_DESCRIPTOR" }
          $staged = Join-Path $env:GITHUB_WORKSPACE "mila/windows-dotnet/bin/Release/net10.0-windows10.0.19041.0/win-x64/mila_native.dll"
          dotnet run --project mila/windows-dotnet-smoke --configuration Release -p:MilaNativeDll=$staged -- --descriptor $env:MILA_JOURNEY_DESCRIPTOR
          if ($LASTEXITCODE -ne 0) { throw "Windows fixture journey failed" }
      # An explicit result lets the fixture job stop once every journey ended.
      - name: Report the journey result to the tailnet fixture
        if: always() && env.MILA_TAILSCALE_AUTHKEY != ''
        shell: bash
        env:
          OUTCOME: ${{ steps.windows-journey.outcome }}
          NODE: mila-windows-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if ! address=$(cat "$RUNNER_TEMP/mila-tailnet-fixture-address" 2>/dev/null); then
            echo "no tunnelled fixture was reached; nothing to report"
            exit 0
          fi
          curl -sS --max-time 10 -X POST "http://$address:8445/finished/$NODE/${OUTCOME:-skipped}" || true

  linux-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # mila/native/linux is a root Cargo workspace member (ADR-0273); keep its
      # build output beside the crate, where the steps below read it.
      CARGO_TARGET_DIR: ${{ github.workspace }}/mila/native/linux/target
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Clippy the Rust FFI
        run: cargo clippy --manifest-path mila/rust/mila-ffi/Cargo.toml --locked -p mila-ffi --all-targets -- -D warnings
      - name: Install GTK4 and libadwaita development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev libgtk-4-bin libadwaita-1-dev pkg-config
      - name: Build and test native GTK client
        working-directory: mila/native/linux
        run: |
          cargo build --locked --release
          test -x target/release/mila-native-linux
          test -x target/release/mila-linux-journey
          # GTK widget-lifecycle tests run against a headless Broadway display
          # and must not skip in CI.
          gtk4-broadwayd :5 &
          broadway=$!
          sleep 1
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:5 GSETTINGS_BACKEND=memory \
            MILA_GTK_TESTS_REQUIRED=1 cargo test --locked
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:5 GSETTINGS_BACKEND=memory \
            MILA_GTK_TESTS_REQUIRED=1 cargo test --locked --features gtk-journey
          kill "$broadway"
      - name: Clippy (ADR-0265)
        working-directory: mila/native/linux
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo clippy --all-targets --locked --features gtk-journey -- -D warnings
      - name: Build the GTK journey window
        working-directory: mila/native/linux
        run: |
          cargo build --locked --release --features gtk-journey
          cp target/release/mila-native-linux "$RUNNER_TEMP/mila-native-linux-gtk-journey"
      - name: GTK journey wiring smoke (unreachable deployment)
        # Drives the real window's Sign in button with no deployment behind
        # it: the window's driver must create the device key, attempt the
        # profile's HTTPS trust fetch and report the typed failure.
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/mila-gtk-smoke"
          mkdir -m 700 "$dir"
          cat > "$dir/descriptor.json" <<'JSON'
          {"version":1,"deployment":{"host":"unreachable.invalid","ssh_port":2222,"https_port":8443},
           "tls":{"ca_pem":"-----BEGIN CERTIFICATE-----\nMIIB\n-----END CERTIFICATE-----","server_name":"unreachable.invalid"},
           "approver":{"url":"https://unreachable.invalid:8443/approve","bearer_token":"smoke"},
           "seed":{"machine_name":"journey-machine","share_principal":"second@example.test"}}
          JSON
          gtk4-broadwayd :6 &
          broadway=$!
          sleep 1
          status=0
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:6 GSETTINGS_BACKEND=memory \
            "$RUNNER_TEMP/mila-native-linux-gtk-journey" --gtk-journey "$dir/descriptor.json" \
            > "$dir/report.json" || status=$?
          kill "$broadway"
          cat "$dir/report.json"
          test "$status" -eq 1
          python3 -I - "$dir/report.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              report: object = json.load(handle)
          steps = report.get("steps") if isinstance(report, dict) else None
          expected = [
              {"name": "gtk_deployments_add", "ok": True, "outcome": "two_listed"},
              {"name": "gtk_deployment_select", "ok": True, "outcome": "selected"},
              {"name": "gtk_sign_in", "ok": False, "outcome": "host_untrusted"},
          ]
          if steps != expected:
              raise SystemExit(f"unexpected GTK journey smoke report: {steps!r}")
          PY
      # The hermetic Marshall+Porsche journey fixture runs on this runner.
      # Every fixture step is gated on the flake exposing `apps.<system>.mila-journey-fixture`,
      # so the job stays green (journey skipped) until the fixture lands.
      - name: Detect hermetic journey fixture
        id: journey
        run: |
          if grep -rqs 'mila-journey-fixture' flake.nix nix; then
            echo "declared=true" >> "$GITHUB_OUTPUT"
          else
            echo "declared=false" >> "$GITHUB_OUTPUT"
            echo "mila-journey-fixture is not declared; journey skipped"
          fi
      - name: Install Nix for the journey fixture
        if: steps.journey.outputs.declared == 'true'
        uses: cachix/install-nix-action@9aaadd8b85853f67fcdf488e6a4e9efa94ee96e2
      # The fixture VM closure (Marshall, Porsche, PostgreSQL) is built and
      # pushed by publish-cache's `checks.x86_64-linux.mila-journey-fixture`.
      - name: Configure Cachix for the journey fixture
        if: steps.journey.outputs.declared == 'true'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: overalls
          extraPullNames: devenv
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false
      # The fixture launcher boots a KVM QEMU VM and refuses to fall back to TCG.
      - name: Enable KVM for the journey fixture
        if: steps.journey.outputs.declared == 'true'
        timeout-minutes: 5
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm -a -w /dev/kvm
      # Building first keeps substitution/build time apart from VM startup.
      - name: Build hermetic journey fixture
        id: fixture
        if: steps.journey.outputs.declared == 'true'
        timeout-minutes: 40
        run: |
          set -euo pipefail
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          if ! nix eval --raw ".#packages.${system}.mila-journey-fixture.drvPath" >/dev/null 2>&1; then
            echo "flake has no packages.${system}.mila-journey-fixture; journey skipped"
            exit 0
          fi
          nix build -L --out-link "$RUNNER_TEMP/mila-journey-fixture" ".#mila-journey-fixture"
          echo "built=true" >> "$GITHUB_OUTPUT"
      - name: Start hermetic journey fixture
        if: steps.fixture.outputs.built == 'true'
        timeout-minutes: 25
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/mila-journey"
          mkdir -p "$dir/state"
          chmod 700 "$dir"
          nohup "$RUNNER_TEMP/mila-journey-fixture/bin/mila-journey-fixture" \
            --descriptor "$dir/descriptor.json" --state "$dir/state" \
            > "$dir/fixture.log" 2>&1 &
          echo "$!" > "$dir/fixture.pid"
          for _ in $(seq 1 1500); do
            if python3 -I -c 'import json, sys; json.load(open(sys.argv[1], encoding="utf-8"))' "$dir/descriptor.json" 2>/dev/null; then
              break
            fi
            if ! kill -0 "$(cat "$dir/fixture.pid")" 2>/dev/null; then
              tail -n 100 "$dir/fixture.log" >&2
              exit 1
            fi
            sleep 1
          done
          python3 -I - "$dir/descriptor.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              document: object = json.load(handle)
          approver = document.get("approver") if isinstance(document, dict) else None
          token = approver.get("bearer_token") if isinstance(approver, dict) else None
          if not isinstance(token, str) or not token:
              raise SystemExit("journey descriptor lacks approver.bearer_token")
          print(f"::add-mask::{token}")
          PY
          echo "MILA_JOURNEY_DESCRIPTOR=$dir/descriptor.json" >> "$GITHUB_ENV"
      # The fixture logs carry no credentials: the bearer is only in descriptor.json.
      - name: Show journey fixture logs
        if: failure() && steps.fixture.outputs.built == 'true'
        run: |
          dir="$RUNNER_TEMP/mila-journey"
          tail -n 200 "$dir/fixture.log" || true
          tail -n 200 "$dir/state/console.log" || true
      - name: Linux journeys against the hermetic fixture
        if: env.MILA_JOURNEY_DESCRIPTOR != ''
        # Fixture hooks may each take up to 330 s under host load.
        timeout-minutes: 30
        run: |
          set -euo pipefail
          # Run both journeys even when the first fails, so each prints its report.
          status=0
          mila/native/linux/target/release/mila-linux-journey --descriptor "$MILA_JOURNEY_DESCRIPTOR" || status=$?
          gtk4-broadwayd :7 &
          broadway=$!
          sleep 1
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:7 GSETTINGS_BACKEND=memory \
            "$RUNNER_TEMP/mila-native-linux-gtk-journey" --gtk-journey "$MILA_JOURNEY_DESCRIPTOR" || status=$?
          kill "$broadway"
          exit "$status"
      - name: Check formatting
        working-directory: mila/native/linux
        run: cargo fmt --all -- --check

  android-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM for the Android emulator
        id: enable-kvm
        continue-on-error: true
        timeout-minutes: 5
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if ! test -r /dev/kvm -a -w /dev/kvm; then
            echo 'KVM unavailable; emulator runner will use software acceleration'
          fi
      # The hermetic Marshall+Porsche journey fixture (ADR-0264) is substituted from
      # Cachix and built before the APK, then boots beside the emulator on this runner.
      # Every fixture step is gated on the flake exposing `packages.<system>.mila-journey-fixture`.
      - name: Detect hermetic journey fixture
        id: journey
        run: |
          if grep -qs 'mila-journey-fixture' flake.nix; then
            echo "declared=true" >> "$GITHUB_OUTPUT"
          else
            echo "declared=false" >> "$GITHUB_OUTPUT"
            echo "mila-journey-fixture is not declared; journey skipped"
          fi
      - name: Install Nix for the journey fixture
        if: steps.journey.outputs.declared == 'true'
        uses: cachix/install-nix-action@9aaadd8b85853f67fcdf488e6a4e9efa94ee96e2
      # The fixture VM closure (Marshall, Porsche, PostgreSQL) is built and
      # pushed by publish-cache's `checks.x86_64-linux.mila-journey-fixture`.
      - name: Configure Cachix for the journey fixture
        if: steps.journey.outputs.declared == 'true'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: overalls
          extraPullNames: devenv
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false
      # Building first keeps substitution/build time apart from VM startup; the
      # VM boots only after the APK is assembled, just before the emulator.
      - name: Build hermetic journey fixture
        id: fixture
        if: steps.journey.outputs.declared == 'true'
        timeout-minutes: 40
        run: |
          set -euo pipefail
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          if ! nix eval --raw ".#packages.${system}.mila-journey-fixture.drvPath" >/dev/null 2>&1; then
            echo "flake has no packages.${system}.mila-journey-fixture; journey skipped"
            exit 0
          fi
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "/dev/kvm unavailable; the fixture never falls back to TCG, journey skipped"
            exit 0
          fi
          # The VM closure and the Android SDK do not both fit the runner's default free space.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
          nix build -L --out-link "$RUNNER_TEMP/mila-journey-fixture" ".#mila-journey-fixture"
          echo "built=true" >> "$GITHUB_OUTPUT"
      - uses: android-actions/setup-android@138b5fb1cf087fdb4c5f3c621466fe304d0cf2e3 # v4.0.4
        continue-on-error: true
        timeout-minutes: 10
        with:
          # Preinstall the emulator and image so reactivecircus does not
          # fetch the moving "latest" archive during the test step.
          packages: >-
            platform-tools
            emulator
            platforms;android-35
            system-images;android-35;google_apis;x86_64
      - name: Ensure Android SDK packages
        timeout-minutes: 15
        run: |
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          export ANDROID_HOME
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || test -x "$(command -v sdkmanager)"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
      - name: Install Android SDK platform
        timeout-minutes: 10
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@fbcece063590cf3e99cc8f93ed063231c98bf95 # v5.0.1
        timeout-minutes: 5
        with:
          gradle-version: '9.3.1'
      - name: Install Rust Android linker
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: clippy
      - name: Install cargo-ndk
        timeout-minutes: 10
        run: cargo install cargo-ndk --locked --version 4.1.2
      # Buck2 targets (ADR-0269 M9) over the SDKs above, through the Nix the
      # journey fixture steps installed: Clippy of the Android FFI library,
      # then the debug and test APKs and unit tests. Gradle verifies every
      # dependency against gradle/verification-metadata.xml.
      - name: Assemble native Compose APK
        timeout-minutes: 30
        run: |
          tools/buck2 build -c overalls.non_hermetic=true //mila:android-ffi-clippy //mila:android-debug
          test -f mila/native/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Start hermetic journey fixture
        if: steps.fixture.outputs.built == 'true'
        timeout-minutes: 25
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/mila-journey"
          mkdir -p "$dir/state"
          chmod 700 "$dir" "$dir/state"
          # The launcher keeps the VM up for the rest of the job. Its output can repeat the
          # descriptor, which carries the approver bearer, so it stays in the owner-only directory.
          nohup "$RUNNER_TEMP/mila-journey-fixture/bin/mila-journey-fixture" \
            --descriptor "$dir/descriptor.json" --state "$dir/state" \
            > "$dir/fixture.log" 2>&1 &
          echo "$!" > "$dir/fixture.pid"
          for _ in $(seq 1 1500); do
            if python3 -I -c 'import json, sys; json.load(open(sys.argv[1], encoding="utf-8"))' "$dir/descriptor.json" 2>/dev/null; then
              break
            fi
            if ! kill -0 "$(cat "$dir/fixture.pid")" 2>/dev/null; then
              echo "mila-journey-fixture exited before publishing a descriptor" >&2
              exit 1
            fi
            sleep 1
          done
          python3 -I - "$dir/descriptor.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              document: object = json.load(handle)
          approver = document.get("approver") if isinstance(document, dict) else None
          token = approver.get("bearer_token") if isinstance(approver, dict) else None
          if not isinstance(token, str) or not token:
              raise SystemExit("journey descriptor lacks approver.bearer_token")
          print(f"::add-mask::{token}")
          PY
          echo "MILA_JOURNEY_DESCRIPTOR=$dir/descriptor.json" >> "$GITHUB_ENV"
      - name: Invoke packaged Rust JNI on Android
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          force-avd-creation: true
          emulator-boot-timeout: 900
          disable-linux-hw-accel: auto
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: mila/native/android
          disable-animations: true
          # Runs the packaged suite, then the fixture journey when MILA_JOURNEY_DESCRIPTOR is set.
          script: bash scripts/run-instrumentation.sh
      # The fixture logs carry no credentials: the bearer is only in descriptor.json.
      - name: Show journey fixture logs
        if: failure() && steps.fixture.outputs.built == 'true'
        run: |
          dir="$RUNNER_TEMP/mila-journey"
          tail -n 200 "$dir/fixture.log" || true
          tail -n 200 "$dir/state/console.log" || true

  # Tunnelled fixture host (ADR-0264). Boots the hermetic backend bound to
  # this runner's tailnet address and serves only the descriptor beside it
  # until the Apple and Windows journey nodes have joined and left (or a
  # deadline passes). Skipped cleanly without MILA_TAILSCALE_AUTHKEY.
  journey-fixture-tailnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    env:
      MILA_TAILSCALE_AUTHKEY: ${{ secrets.MILA_TAILSCALE_AUTHKEY }}
      PEERS: mila-apple-${{ github.run_id }}-${{ github.run_attempt }} mila-windows-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Skip without the tailnet secret
        if: env.MILA_TAILSCALE_AUTHKEY == ''
        run: echo "MILA_TAILSCALE_AUTHKEY is not configured; tunnelled fixture skipped"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: env.MILA_TAILSCALE_AUTHKEY != ''
      - name: Install Nix for the journey fixture
        if: env.MILA_TAILSCALE_AUTHKEY != ''
        uses: cachix/install-nix-action@9aaadd8b85853f67fcdf488e6a4e9efa94ee96e2
      # The fixture VM closure (Marshall, Porsche, PostgreSQL) is built and
      # pushed by publish-cache's `checks.x86_64-linux.mila-journey-fixture`.
      - name: Configure Cachix for the journey fixture
        if: env.MILA_TAILSCALE_AUTHKEY != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: overalls
          extraPullNames: devenv
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false
      - name: Build hermetic journey fixture
        if: env.MILA_TAILSCALE_AUTHKEY != ''
        timeout-minutes: 40
        run: nix build -L --out-link "$RUNNER_TEMP/mila-journey-fixture" ".#mila-journey-fixture"
      - name: Enable KVM for the journey fixture
        if: env.MILA_TAILSCALE_AUTHKEY != ''
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm -a -w /dev/kvm
      - name: Join the Mila CI tailnet
        if: env.MILA_TAILSCALE_AUTHKEY != ''
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          authkey: ${{ env.MILA_TAILSCALE_AUTHKEY }}
          tags: tag:mila-ci
          hostname: mila-fixture-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Serve the fixture on the tailnet until the journeys finish
        if: env.MILA_TAILSCALE_AUTHKEY != ''
        timeout-minutes: 80
        run: |
          set -euo pipefail
          address="$(tailscale ip -4)"
          dir="$RUNNER_TEMP/mila-journey"
          mkdir -p "$dir/public" "$dir/state"
          chmod 700 "$dir"
          nohup "$RUNNER_TEMP/mila-journey-fixture/bin/mila-journey-fixture" --bind "$address" \
            --descriptor "$dir/public/descriptor.json" --state "$dir/state" \
            > "$dir/fixture.log" 2>&1 &
          fixture=$!
          for _ in $(seq 1 1500); do
            [ -s "$dir/public/descriptor.json" ] && break
            kill -0 "$fixture" 2>/dev/null || { tail -n 100 "$dir/fixture.log" >&2; exit 1; }
            sleep 1
          done
          token="$(jq -r .approver.bearer_token "$dir/public/descriptor.json")"
          echo "::add-mask::$token"
          # Only tag:mila-ci peers can reach port 8445 (see the tailnet policy). The
          # script fails fast when this node's tag or packet filter cannot admit them,
          # and stops once every journey job has reported a result or left.
          read -ra peers <<< "$PEERS"
          python3 -I .github/scripts/mila-tailnet-peers.py --bind "$address" \
            --directory "$dir/public" --deadline 3000 "${peers[@]}"
      - name: Show journey fixture logs
        if: failure() && env.MILA_TAILSCALE_AUTHKEY != ''
        run: |
          dir="$RUNNER_TEMP/mila-journey"
          tail -n 200 "$dir/fixture.log" || true
          tail -n 200 "$dir/state/console.log" || true

  native-gate:
    name: Native platform gate
    if: ${{ always() }}
    needs: [apple-native, android-native, linux-native, windows-native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Verify native parity and Flutter removal
        run: |
          python3 - <<'PY'
          from pathlib import Path

          matrix = Path("mila/native/PARITY_MATRIX.md").read_text(encoding="utf-8")
          rows = [line.lower() for line in matrix.splitlines() if line.startswith("|") and "---" not in line]
          if any("partial" in row or "open" in row for row in rows):
              raise SystemExit("parity matrix still contains open or partial rows")
          workflow = Path(".github/workflows/mila-builds.yml").read_text(encoding="utf-8")
          if "FLUTTER_VERSION:" in workflow:
              raise SystemExit("native workflow must not retain Flutter compatibility variables")
          print("Native parity is complete and Flutter compatibility is removed.")
          PY
      - name: Require every native platform job to pass
        env:
          APPLE: ${{ needs.apple-native.result }}
          ANDROID: ${{ needs.android-native.result }}
          LINUX: ${{ needs.linux-native.result }}
          WINDOWS: ${{ needs.windows-native.result }}
        run: |
          set -eu
          for result in "$APPLE" "$ANDROID" "$LINUX" "$WINDOWS"; do
            test "$result" = success || {
              echo "Native platform gate failed: $result" >&2
              exit 1
            }
          done
