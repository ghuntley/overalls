name: "ci"

# Builds and tests what each trunk push changed, chosen from the Buck2 graph
# (ADR-0270): affected -> build -> test -> one job per affected NixOS machine
# test. tools/affected compares the pushed range's base and head target hashes;
# it loads targets only and never builds a Nix derivation. The precommit job runs
# tools/precommit over the same range. The daily full run
# stays in nixos-machine-tests.yml.
#
# Contract ci-affected-workflow: see .github/CONTRACTS.
on:
  push:
    branches: [trunk]
  workflow_dispatch:
    inputs:
      base:
        description: Base revision to compare the checked-out head against.
        required: false
        default: "HEAD^"
      all:
        description: Select every target instead of the affected set.
        type: boolean
        required: false
        default: false
      machine_all:
        description: Run every machine test when everything is selected, instead of leaving them to the daily run.
        type: boolean
        required: false
        default: false

# One run per ref and event: a newer push replaces a pending push, and a
# started run finishes. Dispatches have their own group so a push never
# replaces a covering dispatch. A replaced push stays covered because a push
# run compares against the newest earlier started, non-cancelled push run, not
# against event.before.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  affected:
    runs-on: namespace-profile-cached-amd64-xl;container.privileged=true
    timeout-minutes: 60
    outputs:
      machine_tests: ${{ steps.plan.outputs.machine_tests }}
      evaluate: ${{ steps.plan.outputs.evaluate }}
      evaluate_shards: ${{ steps.plan.outputs.evaluate_shards }}
      tests: ${{ steps.plan.outputs.tests }}
      builds: ${{ steps.plan.outputs.builds }}
      host_builds: ${{ steps.plan.outputs.host_builds }}
      errors: ${{ steps.plan.outputs.errors }}
      range: ${{ steps.select.outputs.range }}
    # Namespace remote cache (ADR-0276): tools/buck2 enables it only while the
    # token is set; forks and pull requests get no secret and build locally.
    env:
      NAMESPACE_RBE_TOKEN: ${{ secrets.NAMESPACE_RBE_TOKEN }}
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
        with:
          fetch-depth: 0
      - uses: ./.github/actions/devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          install-devenv: "false"
      - name: Select affected targets
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ inputs.base }}
          ALL: ${{ inputs.all }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          args=()
          if [ "$EVENT" = push ]; then
            # Pending runs replaced under the concurrency group never ran, so
            # start from the head of the newest earlier push run that started
            # and was not cancelled; event.before is the fallback.
            covered=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/workflows/ci.yml/runs?event=push&branch=$REF&per_page=50" \
              | jq -r --argjson n "$RUN_NUMBER" '[.workflow_runs[] | select(.run_number < $n and .conclusion != "cancelled"
                  and (.status | IN("queued", "pending", "waiting", "requested") | not))]
                | sort_by(.run_number) | last | .head_sha // empty') || covered=""
            if [ -n "$covered" ] && git merge-base --is-ancestor "$covered" HEAD 2>/dev/null; then
              BEFORE=$covered
            fi
            # A new branch or a force push has no usable base: select everything.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
              || ! git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
              args=(--all)
            else
              args=(--base "$BEFORE")
            fi
          elif [ "$ALL" = true ]; then
            args=(--all)
          else
            args=(--base "${BASE:-HEAD^}")
          fi
          # The same range for tools/precommit in the precommit job.
          echo "range=${args[*]}" >> "$GITHUB_OUTPUT"
          # A base run that failed does not make its failures pass: every
          # target whose job failed in a trunk run since the last green one
          # is selected again (ADR-0270). If that history cannot be read,
          # the missing file is a selection error and the ci job fails.
          reselect=()
          if [ "$EVENT" = push ] && [ "${args[0]}" != --all ]; then
            tools/affected failed-in-ci --repo "$REPO" --branch "$REF" \
              --before "$RUN_NUMBER" --output failed.json || rm -f failed.json
            reselect=(--reselect failed.json)
          fi
          tools/affected "${args[@]}" "${reselect[@]}" --output affected.json
          jq -r '.reselected | "reselected after earlier failures: \(length) \(join(" "))"' affected.json \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Plan jobs
        id: plan
        env:
          MACHINE_ALL: ${{ inputs.machine_all }}
          MACHINE_LIMIT: "40"
          PACKAGE_SHARD: "45"
        run: |
          set -euo pipefail
          # Known Inception failures (AGENTS.md) run only in the daily backstop.
          machine=$(jq -c '[.machine_tests[] | select(.labels | index("known_inception_failure") | not)
            | {target, name: (.target | split(":") | last), nested_kvm: (.labels | index("nested_kvm") != null)}]' affected.json)
          # When everything is selected (cells, toolchain or rule changes), the
          # full machine-test set is the daily run's (nixos-machine-tests.yml);
          # dispatch with machine_all to run it here.
          # Until M11 narrows module inputs, a shared-file change (catalog.nix,
          # a common module) selects most suites without setting everything.
          # Above MACHINE_LIMIT suites the daily run covers them too, so one
          # push cannot occupy the shared runner pool with ~200 jobs.
          deferred=false
          if [ "${MACHINE_ALL:-false}" != true ] && { [ "$(jq .everything affected.json)" = true ] \
            || [ "$(jq length <<<"$machine")" -gt "$MACHINE_LIMIT" ]; }; then
            deferred=true
            machine='[]'
          fi
          # Every selected machine test and flake package is evaluated per
          # push, exactly once: `[drv]` runs the declared-only, restricted
          # evaluation without building, so a missing input or module argument
          # fails here rather than in the daily run (an evaluation-time
          # assertion broke every check in publish-cache after a Lyra build
          # change, cache run 41155406148). A successful build implies the
          # evaluation, so nothing that this run or publish-cache.yml builds
          # anyway is evaluated twice:
          # - machine tests in this run's matrix build their own assembly;
          #   only deferred ones (and known Inception failures) evaluate here;
          # - flake_output checks are built by publish-cache.yml, which runs
          #   on every trunk push and pull request and selects every
          #   flake_output check (no affected subset); its --keep-going build
          #   now carries the guarantee that an evaluation-time assertion
          #   (the Lyra break, cache run 41155406148) fails the push. Only
          #   the flake_output packages evaluate here.
          running=$(jq -c '[.[].target]' <<<"$machine")
          machine_evaluate=$(jq -c --argjson running "$running" '[.machine_tests[].target
            | select(. as $t | $running | index($t) | not)
            | sub(":(?<n>[^:]+)$"; ":\(.n).assembly[drv]")]' affected.json)
          package_evaluate=$(jq -c '[.builds[] | select((.labels | index("flake_output")) and (.labels | index("check") | not))
            | "\(.target)[drv]"]' affected.json)
          evaluate=$(jq -c -n --argjson m "$machine_evaluate" --argjson p "$package_evaluate" '$m + $p')
          # Machine assemblies realise guest images at evaluation time: 20 per
          # runner (one runner for ~200 hit the 60-minute timeout, run
          # 41102561512, and 20-target shards took up to 32 minutes in run
          # 41228962477). Package assemblies evaluate in seconds, so a shard
          # takes PACKAGE_SHARD of them and pays the runner setup once.
          evaluate_shards=$(jq -c -n --argjson m "$machine_evaluate" --argjson p "$package_evaluate" \
            --argjson ms 20 --argjson ps "$PACKAGE_SHARD" '
            ([range(0; $m | length; $ms) as $i | $m[$i:$i + $ms]]
             + [range(0; $p | length; $ps) as $i | $p[$i:$i + $ps]])
            | to_entries | map({index: (.key + 1), targets: .value})')
          tests=$(jq -c '[.tests[].target]' affected.json)
          # flake_output assemblies are evaluated above or built by
          # publish-cache.yml. expected_failure targets are soundness probes
          # that must not build.
          all_builds=$(jq -c '[.builds[] | select((.labels | index("flake_output")) or (.labels | index("expected_failure")) | not) | .target]' affected.json)
          # Whole host systems (deployment, base, install) and the kexec image
          # each fill most of a runner's store, so they build one target per
          # runner: several hosts in one job (run 41090838856), and one host's
          # deployment, base and install together (run 41102561512), ran out
          # of space.
          host_re='^root//(fleet/hosts/[^:]+|nix/platform):'
          builds=$(jq -c --arg re "$host_re" '[.[] | select(test($re) | not)]' <<<"$all_builds")
          host_builds=$(jq -c --arg re "$host_re" '[.[] | select(test($re))]
            | map({name: sub("^root//"; ""), targets: [.]})' <<<"$all_builds")
          errors=$(jq '.errors | length' affected.json)
          {
            echo "machine_tests=$machine"
            echo "evaluate=$evaluate"
            echo "evaluate_shards=$evaluate_shards"
            echo "tests=$tests"
            echo "builds=$builds"
            echo "host_builds=$host_builds"
            echo "errors=$errors"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Affected targets"
            jq -r '"everything: \(.everything) \(.reasons | join("; "))"' affected.json
            echo
            echo "- machine tests: $(jq length <<<"$machine") (deferred to the daily run: $deferred)"
            echo "- machine-test evaluations: $(jq length <<<"$evaluate")"
            echo "- tests: $(jq length <<<"$tests")"
            echo "- builds: $(jq length <<<"$builds")"
            echo "- host system builds: $(jq length <<<"$host_builds") runners"
            echo "- selection errors: $errors"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.errors[] | "::error title=selection error in \(.package) (\(.side))::\(.error | split("\n") | first)"' affected.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: affected
          path: affected.json

  build:
    needs: affected
    if: needs.affected.outputs.builds != '[]'
    runs-on: namespace-profile-cached-amd64-xl;container.privileged=true
    timeout-minutes: 180
    # Namespace remote cache (ADR-0276): tools/buck2 enables it only while the
    # token is set; forks and pull requests get no secret and build locally.
    env:
      NAMESPACE_RBE_TOKEN: ${{ secrets.NAMESPACE_RBE_TOKEN }}
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
      - uses: ./.github/actions/devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          install-devenv: "false"
      - name: Build affected targets
        env:
          TARGETS: ${{ needs.affected.outputs.builds }}
        run: |
          set -euo pipefail
          mapfile -t targets < <(jq -r '.[]' <<<"$TARGETS")
          cachix watch-exec overalls -- tools/buck2 build --keep-going "${targets[@]}"
      - name: Check Buck2 state for the Namespace token
        if: always()
        run: tools/namespace-token-scan

  hosts:
    needs: affected
    if: needs.affected.outputs.host_builds != '[]'
    name: build ${{ matrix.host.name }}
    # A host deployment realises ~145 GiB (guest images, the Windows Server
    # image): more than the ~125 GB Namespace allows a cache volume (ENOSPC in
    # runs 41169053536 and 41194732683). The hosts-only 16x64 profile has a
    # 288 GB root disk, and its store stays there instead of on the volume.
    # It takes half the workspace's Linux memory, so only deployments use it;
    # base, install and kexec fit the xl cache volume.
    runs-on: ${{ endsWith(matrix.host.name, ':deployment') && 'namespace-profile-cached-amd64-hosts;container.privileged=true' || 'namespace-profile-cached-amd64-xl;container.privileged=true' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.affected.outputs.host_builds) }}
    # Namespace remote cache (ADR-0276): tools/buck2 enables it only while the
    # token is set; forks and pull requests get no secret and build locally.
    env:
      NAMESPACE_RBE_TOKEN: ${{ secrets.NAMESPACE_RBE_TOKEN }}
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
      - uses: ./.github/actions/devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          install-devenv: "false"
          nix-on-cache-volume: ${{ endsWith(matrix.host.name, ':deployment') && 'false' || 'true' }}
      - name: Build ${{ matrix.host.name }}
        env:
          TARGETS: ${{ toJSON(matrix.host.targets) }}
        run: |
          set -euo pipefail
          df -h /nix
          trap 'df -h /nix' EXIT
          mapfile -t targets < <(jq -r '.[]' <<<"$TARGETS")
          cachix watch-exec overalls -- tools/buck2 build --keep-going "${targets[@]}"

  test:
    needs: affected
    if: needs.affected.outputs.tests != '[]'
    runs-on: namespace-profile-cached-amd64-xl;container.privileged=true
    timeout-minutes: 120
    # Namespace remote cache (ADR-0276): tools/buck2 enables it only while the
    # token is set; forks and pull requests get no secret and build locally.
    env:
      NAMESPACE_RBE_TOKEN: ${{ secrets.NAMESPACE_RBE_TOKEN }}
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
      - uses: ./.github/actions/devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          install-devenv: "false"
      - name: Test affected targets
        env:
          TARGETS: ${{ needs.affected.outputs.tests }}
        run: |
          set -euo pipefail
          mapfile -t targets < <(jq -r '.[]' <<<"$TARGETS")
          cachix watch-exec overalls -- tools/buck2 test --keep-going "${targets[@]}"
      - name: Check Buck2 state for the Namespace token
        if: always()
        run: tools/namespace-token-scan

  evaluate:
    needs: affected
    if: needs.affected.outputs.evaluate != '[]'
    name: evaluate ${{ matrix.shard.index }}
    runs-on: namespace-profile-cached-amd64-xl;container.privileged=true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.affected.outputs.evaluate_shards) }}
    # Namespace remote cache (ADR-0276): tools/buck2 enables it only while the
    # token is set; forks and pull requests get no secret and build locally.
    env:
      NAMESPACE_RBE_TOKEN: ${{ secrets.NAMESPACE_RBE_TOKEN }}
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
      - uses: ./.github/actions/devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          install-devenv: "false"
      - name: Evaluate selected machine tests
        env:
          TARGETS: ${{ toJSON(matrix.shard.targets) }}
        run: |
          set -euo pipefail
          mapfile -t targets < <(jq -r '.[]' <<<"$TARGETS")
          tools/buck2 build --keep-going "${targets[@]}"

  machine:
    needs: affected
    if: needs.affected.outputs.machine_tests != '[]'
    name: ${{ matrix.test.name }}
    # Nested-KVM and KVM suites share the privileged pool that
    # nixos-machine-tests.yml uses; the label picks its system features.
    runs-on: namespace-profile-cached-amd64-xl;container.privileged=true
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.affected.outputs.machine_tests) }}
    # Namespace remote cache (ADR-0276): tools/buck2 enables it only while the
    # token is set; forks and pull requests get no secret and build locally.
    env:
      NAMESPACE_RBE_TOKEN: ${{ secrets.NAMESPACE_RBE_TOKEN }}
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
      - uses: ./.github/actions/devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          install-devenv: "false"
          system-features: ${{ matrix.test.nested_kvm && 'nixos-test benchmark big-parallel kvm nested-kvm' || 'nixos-test benchmark big-parallel kvm' }}
      - name: Report virtualization
        run: |
          ls -l /dev/kvm
          grep -c -w -E 'vmx|svm' /proc/cpuinfo || echo "no vmx/svm CPU flag exposed"
      - name: Test ${{ matrix.test.target }}
        # Pushes the guest images, packages and test drivers realised for this
        # scenario to the overalls cache.
        env:
          TARGET: ${{ matrix.test.target }}
        run: cachix watch-exec overalls -- tools/buck2 test "$TARGET"
      - name: Full build log on failure
        if: failure()
        env:
          TARGET: ${{ matrix.test.target }}
        run: |
          tools/machine-test-log "$TARGET" machine-test.log || true
          cat machine-test.log || true
      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: machine-test-log-${{ matrix.test.name }}
          path: machine-test.log
          if-no-files-found: ignore

  # The repository precommit over the same range (ADR-0269 M8): the commit
  # hook's tools/precommit, so only the checks the range affects run, or every
  # check when everything is selected.
  precommit:
    needs: affected
    runs-on: namespace-profile-cached-amd64-xl;container.privileged=true
    timeout-minutes: 60
    # Namespace remote cache (ADR-0276): tools/buck2 enables it only while the
    # token is set; forks and pull requests get no secret and build locally.
    env:
      NAMESPACE_RBE_TOKEN: ${{ secrets.NAMESPACE_RBE_TOKEN }}
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
        with:
          fetch-depth: 0
      - uses: ./.github/actions/devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          install-devenv: "false"
      - name: Precommit
        env:
          RANGE: ${{ needs.affected.outputs.range }}
        run: |
          set -euo pipefail
          read -ra range <<<"$RANGE"
          tools/precommit "${range[@]}"
      - name: Check Buck2 state for the Namespace token
        if: always()
        run: tools/namespace-token-scan

  ci:
    needs: [affected, build, hosts, test, evaluate, machine, precommit]
    if: always()
    runs-on: namespace-profile-cached-amd64
    steps:
      - name: Require selection, builds and tests to succeed
        env:
          AFFECTED: ${{ needs.affected.result }}
          BUILD: ${{ needs.build.result }}
          HOSTS: ${{ needs.hosts.result }}
          TEST: ${{ needs.test.result }}
          MACHINE: ${{ needs.machine.result }}
          EVALUATE: ${{ needs.evaluate.result }}
          PRECOMMIT: ${{ needs.precommit.result }}
          ERRORS: ${{ needs.affected.outputs.errors }}
        run: |
          status=0
          if [ "$AFFECTED" != success ]; then
            echo "::error::selection did not succeed ($AFFECTED)"; status=1
          fi
          for job in "build:$BUILD" "hosts:$HOSTS" "test:$TEST" "evaluate:$EVALUATE" "machine:$MACHINE" "precommit:$PRECOMMIT"; do
            case "${job#*:}" in
              success|skipped) ;;
              *) echo "::error::${job%%:*} did not succeed (${job#*:})"; status=1 ;;
            esac
          done
          if [ "${ERRORS:-0}" -gt 0 ]; then
            echo "::error::$ERRORS packages failed to load; see the affected job"; status=1
          fi
          exit $status
