name: Redaction profile updates

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: redaction-profile-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: namespace-profile-cached-amd64-xl;container.privileged=true
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/devenv
      - name: Generate profile
        run: devenv shell -- python scripts/update_redaction_profile.py
      - name: Start PostgreSQL
        run: |
          devenv up --detach postgres
          for _ in $(seq 1 60); do
            if devenv shell -- pg_isready -q; then exit 0; fi
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1
      - name: Verify profile and scanner
        run: devenv shell -- bash -euo pipefail -c 'cd marshall && mix local.hex --force --if-missing && mix local.rebar --force --if-missing && mix deps.get && mix test test/marshall/redaction/scanner_test.exs'
      - name: Commit profile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- marshall/priv/redaction/profile.json; then
            echo "Profile is current"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add marshall/priv/redaction/profile.json
          git commit -m 'Update generated redaction profile'
          git push origin HEAD:trunk
          gh workflow run publish-cache.yml --ref trunk
