name: devenv
description: Mount caches from the Namespace cache volume, install Nix, configure Cachix and optionally install the locked devenv CLI.

inputs:
  cachix-auth-token:
    description: Token for pushing to the overalls Cachix cache.
    required: false
    default: ""
  cache-paths:
    description: Extra workspace-relative or absolute paths to keep on the cache volume.
    required: false
    default: ""
  system-features:
    description: >-
      Nix system features this runner provides. Every privileged Namespace
      runner exposes /dev/kvm, which evaluation needs for import-from-derivation
      image builds (vmTools); machine tests add nested-kvm.
    required: false
    default: nixos-test benchmark big-parallel kvm
  install-devenv:
    description: Whether to install the devenv CLI.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # The cache mount must run after checkout (which wipes the workspace) and
    # before Nix is installed. `nix` mode keeps /nix and ~/.cache/nix (flake, tarball and
    # evaluation caches) on the volume; `npm` cannot be used because npm comes
    # from the devenv shell, so its cache directory is listed explicitly.
    # Cargo builds run outside Nix (for example Enrico's test helper builds
    # native/git-owner), so every crate's target directory and the Cargo
    # registry and git checkouts stay on the volume. Nix-built crates are
    # cached by the Nix store and Cachix instead.
    - name: List Rust target directories
      id: rust
      shell: bash
      run: |
        {
          echo "targets<<EOF"
          # Nix-domain helper crates are built in isolated stores and their
          # checkout target parents are not writable on Namespace cache mounts.
          # Keep ordinary Cargo targets on the cache volume while leaving Nix
          # artifacts to Cachix/Nix store caching.
          git ls-files -z -- '*Cargo.toml' ':!:**/vendor/**' | xargs -0 -n1 dirname | sort -u |
            grep -v '^nix/domains/system/' | sed 's#$#/target#'
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Mount caches from cache volume
      uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
      with:
        cache: nix
        path: |
          ~/.npm
          ~/.cache/devenv
          ~/.cargo/registry
          ~/.cargo/git
          ${{ steps.rust.outputs.targets }}
          ${{ inputs.cache-paths }}

    # Builds MUST be sandboxed: without it the builder's /bin/sh is the runner
    # container's dash, which broke lilly-hostd's helper-script tests. The
    # sandbox needs a privileged runner container
    # (`<profile>;container.privileged=true`); with fallback disabled an
    # unprivileged runner fails loudly instead of building unsandboxed.
    #
    # Builds MUST also run as nixbld build users under a nix-daemon, as on the
    # fleet. A single-user install builds as the runner user, whose sandbox
    # root is writable; nix-compact's functional tests then create
    # /homeless-shelter and refuse their own nested builds. The runner
    # container has no systemd, so install-nix-action would fall back to
    # single-user: install multi-user here and start the daemon directly.
    # The installer takes ownership of a /nix restored from the cache volume.
    #
    # The store MUST stay within the cache volume (116 GB). Evaluation
    # realises multi-gigabyte guest and storage images through
    # import-from-derivation, so min-free/max-free let the daemon collect
    # unrooted paths (images of finished evaluations, outputs already pushed)
    # before a build or substitution would exhaust it.
    - name: Install Nix
      shell: bash
      env:
        NIX_VERSION: 2.30.2
        GITHUB_ACCESS_TOKEN: ${{ github.token }}
        SYSTEM_FEATURES: ${{ inputs.system-features }}
      run: |
        conf=$(mktemp)
        cat > "$conf" <<EOF
        experimental-features = nix-command flakes
        access-tokens = github.com=$GITHUB_ACCESS_TOKEN
        trusted-users = root $USER
        always-allow-substitutes = true
        sandbox = true
        sandbox-fallback = false
        system-features = $SYSTEM_FEATURES
        max-jobs = auto
        cores = 0
        min-free = 17179869184
        max-free = 51539607552
        EOF
        curl -sSfL --retry 5 -o "$RUNNER_TEMP/install-nix" \
          "https://releases.nixos.org/nix/nix-$NIX_VERSION/install"
        sh "$RUNNER_TEMP/install-nix" --daemon --yes --no-channel-add \
          --daemon-user-count "$(( $(nproc) * 2 ))" --nix-extra-conf-file "$conf"
        rm -f "$conf"
        # A socket restored from the cache volume would end the wait early.
        sudo rm -f /nix/var/nix/daemon-socket/socket
        # NixOS's nix-daemon unit sets LimitNOFILE=1048576. VM image builds
        # need it: virtiofsd holds a descriptor per inode when it cannot
        # open file handles, and copying a system closure exceeds the
        # container's default limit (the build VM panics with ENFILE).
        sudo sh -c 'ulimit -n 1048576 && nohup /nix/var/nix/profiles/default/bin/nix-daemon > /tmp/nix-daemon.log 2>&1 &'
        for _ in $(seq 1 30); do
          [ -S /nix/var/nix/daemon-socket/socket ] && break
          sleep 1
        done
        echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
        echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
        echo "NIX_REMOTE=daemon" >> "$GITHUB_ENV"
        NIX_REMOTE=daemon /nix/var/nix/profiles/default/bin/nix store info

    # Push in the post-job step rather than through the cachix daemon: the
    # daemon holds a read lock on the local Nix database for the whole job,
    # which deadlocks devenv when it needs the write lock.
    - name: Configure Cachix
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: overalls
        extraPullNames: devenv
        authToken: ${{ inputs.cachix-auth-token }}
        useDaemon: false

    # Install the CLI from the devenv revision pinned in devenv.lock so it
    # matches the modules it evaluates; devenv.cachix.org serves the build.
    - name: Install devenv
      if: inputs.install-devenv == 'true'
      shell: bash
      run: |
        rev=$(jq -r '.nodes.devenv.locked.rev' devenv.lock)
        nix profile add "github:cachix/devenv/$rev"
        devenv version
