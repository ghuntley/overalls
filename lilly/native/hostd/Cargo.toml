[package]
name = "lilly-hostd"
version = "0.1.0"
edition = "2021"

[lib]
name = "lilly_hostd"
path = "src/lib.rs"

[[bin]]
name = "lilly-hostd"
path = "src/main.rs"

[dependencies]
libc = "=0.2.191"
rustix = { version = "=1.1.5", features = ["event", "fs", "mount", "net", "pipe", "process", "thread", "time"] }

[dev-dependencies]
hegeltest = "=0.28.8"
tempfile = "3"

[lints]
workspace = true
