[package]
name = "overalls-otel-guest-receiver"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
libc = "0.2"
opentelemetry-proto = { version = "0.31", default-features = false, features = ["gen-tonic-messages", "metrics", "trace"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
hegeltest = "=0.28.8"
