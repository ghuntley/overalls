[package]
name = "lilly-terminald"
version = "0.1.0"
edition = "2021"

[features]
antithesis-observer = []

# serde decodes the Windows MMDS boot identity; it is a plain dependency so
# the decoder's unit tests also run on Linux.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows guests (ADR-0171): viosock listener and ConPTY sessions. Versions
# match Lyra's lock so both Windows builds share them.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_NetManagement",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[dev-dependencies]
hegeltest = "=0.28.8"

[lints]
workspace = true
