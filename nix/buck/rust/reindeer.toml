# reindeer configuration for the generated Rust third-party cell (rust//).
# nix/buck/rust.nix runs `reindeer buckify` with it over the pseudo-package
# that nix/buck/rust_cell.py derives from the root Cargo workspace (ADR-0273).
vendor = true
# Whole-crate srcs (every .rs file); the default fixups add the rest of each
# crate (READMEs and data that include_str!/include_bytes! read).
precise_srcs = false
cargo_env = true

[buck]
file_name = "BUCK"
rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
buildscript_genrule = "buildscript_run"
buckfile_imports = """
load("@prelude//rust:cargo_buildscript.bzl", "buildscript_run")
load("@prelude//rust:cargo_package.bzl", "cargo")
"""
generated_file_header = """
# Generated by reindeer in nix/buck/rust.nix from the root Cargo.lock; do not edit.
"""
