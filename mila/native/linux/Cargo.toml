[package]
name = "mila-native-linux"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Isolated GTK4/libadwaita native presentation seam for Mila"
publish = false
build = "build.rs"

# A member of the root Cargo workspace (ADR-0273); it links the Mila crates by path.

[features]
# Adds `mila-native-linux --gtk-journey <descriptor>`, which drives the real GTK
# window against the hermetic fixture and approves through the fixture's
# approver hook. Release builds leave it off.
gtk-journey = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa"] }
mila-ffi = { path = "../../rust/mila-ffi" }
mila-session = { path = "../../rust/mila-session" }
mila-runtime = { path = "../../rust/mila-runtime" }
mila-protocol = { path = "../../rust/mila-protocol" }
# Keep the GTK and libadwaita bindings on the same generation. The host's GTK runtime
# remains responsible for supplying the system libraries at build and run time.
gtk = { package = "gtk4", version = "0.9" }
adw = { package = "libadwaita", version = "0.7" }

[lints]
workspace = true
