[package]
name = "mila-native-linux"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Isolated GTK4/libadwaita native presentation seam for Mila"
publish = false
build = "build.rs"

# This crate is deliberately standalone. It is not a member of mila/rust's workspace
# until the generated runtime binding is ready to be integrated by a host build.

[features]
# Adds `mila-native-linux --gtk-journey <descriptor>`, which drives the real GTK
# window against the hermetic fixture and approves through the fixture's
# approver hook. Release builds leave it off.
gtk-journey = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa"] }
mila-ffi = { path = "../../rust/mila-ffi" }
mila-session = { path = "../../rust/mila-session" }
mila-runtime = { path = "../../rust/mila-runtime" }
mila-protocol = { path = "../../rust/mila-protocol" }
# Keep the GTK and libadwaita bindings on the same generation. The host's GTK runtime
# remains responsible for supplying the system libraries at build and run time.
gtk = { package = "gtk4", version = "0.9" }
adw = { package = "libadwaita", version = "0.7" }

# ADR-0265 canonical Rust lint policy. Copied verbatim into every Overalls crate;
# scripts/check_rust_lints.exs refuses drift. Gates run clippy with -D warnings.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
allow_attributes_without_reason = "warn"
mem_forget = "warn"
string_slice = "warn"
as_underscore = "warn"
lossy_float_literal = "warn"
# Internal unpublished crates: these pedantic lints add noise without catching defects.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
