[workspace]
resolver = "2"
members = [
  "mila-model",
  "mila-protocol",
  "mila-crypto",
  "mila-runtime",
  "mila-ffi",
  "mila-transport",
  "mila-session",
  "mila-localization",
  "mila-journey",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Overalls contributors"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
sha2 = "0.10"
hegeltest = "=0.28.8"
