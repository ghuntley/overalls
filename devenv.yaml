inputs:
  nix-compact:
    url: github:ghuntley/nix-compact/84475ca7652fcdabd36428d80d4c1122bb03bab6
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  # Upstream Rust release toolchains with iOS standard libraries for the
  # Darwin Mila Apple build (devenv.nix languages.rust).
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
